<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Associações - Lajeosa do Mondego</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--verde-base);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header button {
            background-color: var(--cor-cartao-castanho-escuro);
            border: none;
            padding: 10px 16px;
            border-radius: 18px;
            color: var(--dourado);
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 10px;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        header button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: var(--dourado);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 10px 20px;
        }

        /* Cartões castanhos premium */
        .card {
            background-color: var(--cor-cartao-castanho-escuro) !important;
            padding: 18px !important;
            border-radius: 18px !important;
            cursor: pointer;
            transition: 0.25s;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        .card i {
            font-size: 36px;
            color: var(--dourado);
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
            color: white;
        }
    </style>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>
    <button onclick="window.location.href='index.html'">← Voltar</button>
    <h1>Associações</h1>
</header>

<div class="grid">

    <div class="card" onclick="openPage('alss.html')">
        <i class="fas fa-hand-holding-heart"></i>
        <p>Solidariedade Social (ALSS)</p>
    </div>

    <!--
    <div class="card" onclick="openPage('associacao_juvenil.html')">
        <i class="fas fa-users"></i>
        <p>Associação Juvenil</p>
    </div>
    -->

</div>

<script>
    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
