<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória</title>

    <!-- Carregar style.css -->
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyCTnteZsANQ6wH0O96Jn_7H0esaqkiMT4w",
        authDomain: "lajeosaapp.firebaseapp.com",
        databaseURL: "https://lajeosaapp-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "lajeosaapp",
        storageBucket: "lajeosaapp.firebasestorage.app",
        messagingSenderId: "646170764557",
        appId: "1:646170764557:web:202ceb63c421979cc27c44"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--verde-base);
            color: white;
            text-align: center;
            padding-bottom: 40px;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 120px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: var(--dourado);
        }

        /* Botões premium */
        #voltar, #btnStart, #reiniciar {
            background-color: var(--cor-cartao-castanho-escuro);
            color: var(--dourado);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        #voltar {
            padding: 10px 20px;
            font-size: 16px;
        }

        #btnStart {
            padding: 14px 26px;
            font-size: 20px;
            margin-top: 20px;
        }

        #reiniciar {
            padding: 10px 20px;
            font-size: 16px;
            margin-top: 10px;
        }

        #voltar:hover, #btnStart:hover, #reiniciar:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        #info span {
            color: var(--dourado);
            font-weight: bold;
        }

        /* Tabuleiro */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 12px; /* espaçamento entre cartas */
            justify-content: center;
            margin-top: 25px;
        }

        /* Cartas do jogo (isoladas do estilo global) */
        .memory-card {
            width: 80px;
            height: 80px;
            background-color: var(--cor-cartao-castanho-escuro);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: 0.3s;
            color: transparent;

            /* Remover interferência do estilo global .card */
            margin: 0 !important;
            border-left: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .memory-card:hover {
            transform: scale(1.05);
        }

        /* Carta revelada */
        .memory-card.revelada {
            background-color: var(--dourado);
            color: #0F3D2E;
            border-left: none !important;
        }

        /* Leaderboard premium */
        #leaderboard {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--cor-cartao-castanho-escuro);
            border-radius: 12px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        #leaderboard h2 {
            color: var(--dourado);
        }

        #leaderboard li {
            margin: 6px 0;
            font-size: 18px;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Jogo da Memória</h1>
    <button id="voltar" onclick="openPage('jogos.html')">← Voltar ao Menu</button>
</header>

<div id="inicio">
    <p style="color:var(--dourado); font-size:18px; margin-bottom:14px;">
        Neste jogo o objetivo é juntar duas cartas iguais.
    </p>

    <button id="btnStart">🎮 Carregue aqui para começar</button>
</div>

<div id="info" style="display:none;">
    Jogadas: <span id="jogadas">0</span> — Tempo: <span id="tempo">0s</span>
    <br>
    <button id="reiniciar">Novo jogo</button>
</div>

<div id="tabuleiro" class="grid" style="display:none;"></div>

<div id="leaderboard">
    <h2>🏆 Top 10 de Jogadores</h2>
    <ul id="listaTop"></ul>
</div>

<script>
    function openPage(page) {
        window.location.href = page;
    }

    const icones = ["🌞","🌙","⭐","🔥","🍀","⚡","🌈","❄️"];
    let cartas = [...icones, ...icones];

    let primeiraCarta = null;
    let segundaCarta = null;
    let bloqueio = false;
    let jogadas = 0;
    let tempo = 0;
    let intervaloTempo = null;

    const inicioDiv = document.getElementById("inicio");
    const btnStart = document.getElementById("btnStart");
    const info = document.getElementById("info");
    const tabuleiro = document.getElementById("tabuleiro");
    const jogadasEl = document.getElementById("jogadas");
    const tempoEl = document.getElementById("tempo");
    const reiniciarBtn = document.getElementById("reiniciar");
    const listaTop = document.getElementById("listaTop");

    function iniciarJogo() {
        jogadas = 0;
        tempo = 0;
        jogadasEl.textContent = jogadas;
        tempoEl.textContent = tempo + "s";

        clearInterval(intervaloTempo);
        intervaloTempo = setInterval(() => {
            tempo++;
            tempoEl.textContent = tempo + "s";
        }, 1000);

        cartas.sort(() => Math.random() - 0.5);
        tabuleiro.innerHTML = "";

        cartas.forEach((icone, index) => {
            const div = document.createElement("div");
            div.classList.add("memory-card");
            div.dataset.icone = icone;
            div.dataset.index = index;
            div.addEventListener("click", clicarCarta);
            tabuleiro.appendChild(div);
        });
    }

    btnStart.addEventListener("click", () => {
        inicioDiv.style.display = "none";
        info.style.display = "block";
        tabuleiro.style.display = "grid";
        iniciarJogo();
    });

    reiniciarBtn.addEventListener("click", () => {
        inicioDiv.style.display = "block";
        info.style.display = "none";
        tabuleiro.style.display = "none";
        tabuleiro.innerHTML = "";
        clearInterval(intervaloTempo);
    });

    function clicarCarta(e) {
        if (bloqueio) return;

        const carta = e.target;

        if (carta.classList.contains("revelada")) return;

        carta.classList.add("revelada");
        carta.textContent = carta.dataset.icone;

        if (!primeiraCarta) {
            primeiraCarta = carta;
            return;
        }

        segundaCarta = carta;
        jogadas++;
        jogadasEl.textContent = jogadas;

        if (primeiraCarta.dataset.icone === segundaCarta.dataset.icone) {
            primeiraCarta = null;
            segundaCarta = null;

            verificarVitoria();
        } else {
            bloqueio = true;
            setTimeout(() => {
                primeiraCarta.classList.remove("revelada");
                segundaCarta.classList.remove("revelada");
                primeiraCarta.textContent = "";
                segundaCarta.textContent = "";
                primeiraCarta = null;
                segundaCarta = null;
                bloqueio = false;
            }, 800);
        }
    }

    function verificarVitoria() {
        const todas = document.querySelectorAll(".memory-card");
        const reveladas = [...todas].filter(c => c.classList.contains("revelada"));

        if (reveladas.length === cartas.length) {
            clearInterval(intervaloTempo);

            const nome = prompt("Parabéns! Escreve o teu nome para entrar no Top Jogadores:");

            if (nome) {
                guardarPontuacao(nome, tempo, jogadas);
            }

            mostrarLeaderboard();
        }
    }

    /* --- LEADERBOARD GLOBAL (FIREBASE) --- */

    function guardarPontuacao(nome, tempo, jogadas) {
        db.ref("topJogadores").once("value", snapshot => {
            const top = snapshot.val() || [];

            top.push({ nome, tempo, jogadas });

            top.sort((a, b) => {
                if (a.tempo !== b.tempo) return a.tempo - b.tempo;
                return a.jogadas - b.jogadas;
            });

            const top10 = top.slice(0, 10);

            db.ref("topJogadores").set(top10);
        });
    }

    function mostrarLeaderboard() {
        db.ref("topJogadores").once("value", snapshot => {
            const top = snapshot.val() || [];
            listaTop.innerHTML = "";

            top.forEach((j, i) => {
                const li = document.createElement("li");
                li.textContent = `#${i+1} — ${j.nome} — ${j.tempo}s — ${j.jogadas} jogadas`;
                listaTop.appendChild(li);
            });
        });
    }

    mostrarLeaderboard();
</script>

</body>
</html>
