<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Trânsito em Tempo Real</title>
<link rel="stylesheet" href="style.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: var(--verde-base);
        color: white;
        text-align: center;
    }

    h2 {
        color: var(--dourado);
        margin-top: 20px;
        margin-bottom: 10px;
    }

    /* MAPA */
    .mapa {
        width: 100%;
        height: 320px;
        border-radius: 12px;
        overflow: hidden;
        margin: 20px auto;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    /* CARTÕES */
    .cartao {
        background-color: var(--cor-cartao-base);
        padding: 16px;
        margin: 12px 20px;
        border-radius: 14px;
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
        text-align: left;
    }

    .cartao h3 {
        margin: 0;
        color: var(--dourado);
        font-size: 20px;
    }

    .cartao p {
        margin: 6px 0;
        font-size: 15px;
    }

    .cartao a {
        color: var(--dourado);
        font-weight: bold;
        text-decoration: none;
    }

    .cartao a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<h2>Trânsito em Tempo Real</h2>

<!-- MAPA GOOGLE MAPS (SEM API, SEM ERROS) -->
<div class="mapa">
    <iframe
        width="100%" height="100%"
        src="https://www.google.com/maps/@40.537,-7.265,13z?hl=pt&entry=ttu&layer=traffic"
        style="border:0;" allowfullscreen>
    </iframe>
</div>

<h2>Ocorrências na Região</h2>

<div id="lista"></div>

<script>
async function carregarWaze() {
    const lista = document.getElementById("lista");

    try {
        // Waze JSON (não oficial, mas gratuito)
        const resp = await fetch("https://corsproxy.io/?https://www.waze.com/row-rtserver/web/TGeoRSS?types=alerts&format=JSON");
        const dados = await resp.json();

        const alertas = dados.alerts || [];

        if (alertas.length === 0) {
            lista.innerHTML = "<p style='color:var(--dourado); margin-top:20px;'>Sem ocorrências de momento.</p>";
            return;
        }

        alertas.forEach(a => {
            const tipo = a.type || "Ocorrência";
            const local = a.location || "Local não especificado";
            const hora = new Date(a.pubMillis).toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });

            const lat = a.latitude;
            const lon = a.longitude;

            lista.innerHTML += `
                <div class="cartao">
                    <h3>${tipo}</h3>
                    <p><strong>Local:</strong> ${local}</p>
                    <p><strong>Hora:</strong> ${hora}</p>
                    <p><a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank">Abrir no mapa →</a></p>
                </div>
            `;
        });

    } catch (e) {
        lista.innerHTML = "<p style='color:var(--dourado); margin-top:20px;'>Não foi possível carregar dados do Waze.</p>";
    }
}

carregarWaze();
</script>

</body>
</html>
