<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preços dos Combustíveis – Guarda</title>

<style>
    body {
        background-color: #0F3D2E;
        color: white;
        font-family: Arial, sans-serif;
        padding: 0;
        margin: 0;
    }

    h1 {
        color: #D4AF37;
        text-align: center;
        padding: 20px;
        margin: 0;
        background-color: #134C3A;
        font-size: 22px;
    }

    .posto-card {
        background-color: #134C3A;
        padding: 15px;
        margin: 15px;
        border-radius: 10px;
        animation: fadeIn 0.4s forwards;
        opacity: 0;
        transform: translateY(10px);
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .posto-nome {
        font-size: 18px;
        font-weight: bold;
        color: #D4AF37;
        margin-bottom: 8px;
    }

    .combustivel {
        margin: 5px 0;
        font-size: 16px;
    }

    .voltar {
        display: block;
        padding: 15px;
        text-align: center;
        background-color: #134C3A;
        color: #D4AF37;
        text-decoration: none;
        font-size: 18px;
    }

    footer {
        margin-top: 0;
        padding: 10px;
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
        background-color: #0F3D2E;
        color: white;
    }

    .mensagem {
        text-align: center;
        opacity: 0.8;
        margin-top: 10px;
    }
</style>
</head>

<body>

<h1>Preços dos Combustíveis – Distrito da Guarda</h1>

<p id="msg" class="mensagem">A carregar preços atualizados…</p>

<div id="lista"></div>

<a class="voltar" href="seguranca.html">← Voltar</a>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
const API_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=combustiveis-guarda";

async function carregar() {
    const msg = document.getElementById("msg");
    const lista = document.getElementById("lista");

    try {
        const resp = await fetch(API_URL);
        const dados = await resp.json();

        msg.style.display = "none";

        dados.items.forEach(p => {
            const card = document.createElement("div");
            card.className = "posto-card";

            let html = `
                <div class="posto-nome">${p.nome} — ${p.marca}</div>
                <div><strong>Local:</strong> ${p.localidade}, ${p.concelho}</div>
                <div><strong>Morada:</strong> ${p.morada || "—"}</div>
                <hr style="opacity:0.2">
            `;

            p.combustiveis.forEach(c => {
                html += `
                    <div class="combustivel">
                        <strong>${c.tipo}:</strong> ${c.preco} € 
                        <span style="opacity:0.7; font-size:14px;">(${c.data})</span>
                    </div>
                `;
            });

            card.innerHTML = html;
            lista.appendChild(card);
        });

    } catch (e) {
        msg.innerHTML = "Erro ao carregar preços.";
    }
}

carregar();
</script>

</body>
</html>
