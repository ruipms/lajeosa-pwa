<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preços dos Combustíveis – Guarda</title>

<style>
    body {
        background-color: #0F3D2E;
        color: white;
        font-family: Arial, sans-serif;
        padding: 0;
        margin: 0;
    }

    h1 {
        color: #D4AF37;
        text-align: center;
        padding: 20px;
        margin: 0;
        background-color: #134C3A;
        font-size: 22px;
    }

    .accordion {
        margin: 10px;
        border-radius: 8px;
        overflow: hidden;
        background-color: #134C3A;
    }

    .accordion-header {
        background-color: #0F3D2E;
        color: #D4AF37;
        padding: 15px;
        cursor: pointer;
        font-size: 18px;
        border-bottom: 1px solid #134C3A;
    }

    .accordion-header:hover {
        background-color: #15523F;
    }

    .accordion-content {
        display: none;
        padding: 10px 15px;
        background-color: #134C3A;
    }

    .posto-card {
        background-color: #15523F;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 8px;
    }

    .posto-nome {
        font-size: 17px;
        font-weight: bold;
        color: #D4AF37;
        margin-bottom: 6px;
    }

    .combustivel {
        margin-top: 5px;
        font-size: 15px;
    }

    .voltar {
        display: block;
        padding: 15px;
        text-align: center;
        background-color: #134C3A;
        color: #D4AF37;
        text-decoration: none;
        font-size: 18px;
    }

    footer {
        margin-top: 0;
        padding: 10px;
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
        background-color: #0F3D2E;
        color: white;
    }

    .mensagem {
        text-align: center;
        opacity: 0.8;
        margin-top: 10px;
    }
</style>
</head>

<body>

<h1>Preços dos Combustíveis – Distrito da Guarda</h1>

<p id="msg" class="mensagem">A carregar preços atualizados…</p>

<div id="lista"></div>

<a class="voltar" href="seguranca.html">← Voltar</a>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
const API_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=combustiveis-guarda";

async function carregar() {
    const msg = document.getElementById("msg");
    const lista = document.getElementById("lista");

    try {
        const resp = await fetch(API_URL);
        const dados = await resp.json();

        msg.style.display = "none";

        // Agrupar por município
        const grupos = {};

        dados.items.forEach(p => {
            if (!grupos[p.municipio]) grupos[p.municipio] = [];
            grupos[p.municipio].push(p);
        });

        // Criar acordeões
        Object.keys(grupos).sort().forEach(municipio => {
            const acc = document.createElement("div");
            acc.className = "accordion";

            const header = document.createElement("div");
            header.className = "accordion-header";
            header.textContent = municipio;

            const content = document.createElement("div");
            content.className = "accordion-content";

            grupos[municipio].forEach(p => {
                const card = document.createElement("div");
                card.className = "posto-card";

                card.innerHTML = `
                    <div class="posto-nome">${p.nome} — ${p.marca}</div>
                    <div><strong>Localidade:</strong> ${p.localidade}</div>
                    <div><strong>Morada:</strong> ${p.morada || "—"}</div>
                    <div class="combustivel">
                        <strong>${p.combustivel}:</strong> ${p.preco}
                        <span style="opacity:0.7; font-size:14px;">(${p.data})</span>
                    </div>
                `;

                content.appendChild(card);
            });

            header.addEventListener("click", () => {
                content.style.display = content.style.display === "block" ? "none" : "block";
            });

            acc.appendChild(header);
            acc.appendChild(content);
            lista.appendChild(acc);
        });

    } catch (e) {
        msg.innerHTML = "Erro ao carregar preços.";
    }
}

carregar();
</script>

</body>
</html>
