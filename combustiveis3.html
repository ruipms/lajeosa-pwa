<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preços dos Combustíveis – Guarda</title>

<!-- Carregar style.css -->
<link rel="stylesheet" href="style.css">

<!-- Google tag (Analytics) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<style>
    body {
        background-color: var(--verde-base);
        color: white;
        font-family: Arial, sans-serif;
        padding: 0;
        margin: 0;
    }

    h1 {
        color: var(--dourado);
        text-align: center;
        padding: 20px;
        margin: 0;
        background-color: var(--cor-cartao-castanho-escuro);
        font-size: 22px;
        border-bottom: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .accordion {
        margin: 12px;
        border-radius: 12px;
        overflow: hidden;
        background-color: var(--cor-cartao-castanho-escuro);
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .accordion-header {
        background-color: var(--cor-cartao-castanho-claro);
        color: var(--dourado);
        padding: 15px;
        cursor: pointer;
        font-size: 18px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        transition: 0.2s;
    }

    .accordion-header:hover {
        background-color: var(--cor-cartao-castanho-escuro);
    }

    .accordion-content {
        display: none;
        padding: 10px 15px;
        background-color: var(--cor-cartao-castanho-claro);
    }

    .posto-card {
        background-color: var(--cor-cartao-castanho-escuro);
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 12px;
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .posto-nome {
        font-size: 17px;
        font-weight: bold;
        color: var(--dourado);
        margin-bottom: 6px;
    }

    .combustivel {
        margin-top: 5px;
        font-size: 15px;
    }

    .voltar {
        display: block;
        padding: 15px;
        text-align: center;
        background-color: var(--cor-cartao-castanho-escuro);
        color: var(--dourado);
        text-decoration: none;
        font-size: 18px;
        border-left: 4px solid var(--dourado);
        margin-top: 20px;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .voltar:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 18px rgba(227,193,90,0.55);
    }

    footer {
        margin-top: 0;
        padding: 10px;
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
        background-color: var(--verde-base);
        color: var(--dourado);
    }

    .mensagem {
        text-align: center;
        opacity: 0.8;
        margin-top: 10px;
        color: var(--dourado);
    }
</style>
</head>

<body>

<h1>Preços dos Combustíveis – Distrito da Guarda</h1>

<p id="msg" class="mensagem">A carregar preços atualizados…</p>

<div id="lista"></div>

<a class="voltar" href="seguranca.html">← Voltar</a>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
const API_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=combustiveis-guarda";

async function carregar() {
    const msg = document.getElementById("msg");
    const lista = document.getElementById("lista");

    try {
        const resp = await fetch(API_URL);
        const dados = await resp.json();

        msg.style.display = "none";

        // Agrupar por município
        const grupos = {};

        dados.items.forEach(p => {
            if (!grupos[p.municipio]) grupos[p.municipio] = [];
            grupos[p.municipio].push(p);
        });

        // Criar acordeões
        Object.keys(grupos).sort().forEach(municipio => {
            const acc = document.createElement("div");
            acc.className = "accordion";

            const header = document.createElement("div");
            header.className = "accordion-header";
            header.textContent = municipio;

            const content = document.createElement("div");
            content.className = "accordion-content";

            grupos[municipio].forEach(p => {
                const card = document.createElement("div");
                card.className = "posto-card";

                let html = `
                    <div class="posto-nome">${p.nome} — ${p.marca}</div>
                    <div><strong>Localidade:</strong> ${p.localidade}</div>
                    <div><strong>Morada:</strong> ${p.morada || "—"}</div>
                    <hr style="opacity:0.2">
                `;

                // Mostrar TODOS os combustíveis
                p.combustiveis.forEach(c => {
                    html += `
                        <div class="combustivel">
                            <strong>${c.tipo}:</strong> ${c.preco}
                            <span style="opacity:0.7; font-size:14px;">(${c.data})</span>
                        </div>
                    `;
                });

                card.innerHTML = html;
                content.appendChild(card);
            });

            header.addEventListener("click", () => {
                content.style.display = content.style.display === "block" ? "none" : "block";
            });

            acc.appendChild(header);
            acc.appendChild(content);
            lista.appendChild(acc);
        });

    } catch (e) {
        msg.innerHTML = "Erro ao carregar preços.";
    }
}

carregar();
</script>

</body>
</html>
