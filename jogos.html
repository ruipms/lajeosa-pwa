<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos — Lajeosa do Mondego</title>

    <link rel="icon" href="assets/brasao.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 120px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #D4AF37;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        .card {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background-color: #2a7a5e;
        }

        .card i {
            font-size: 36px;
            color: #D4AF37;
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
        }

        #voltar {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #1F5C45;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Jogos</h1>
    <button id="voltar" onclick="openPage('index.html')">← Voltar ao Menu</button>
</header>

<div class="grid">

    <div class="card" onclick="openPage('jogo-memoria.html')">
        <i class="fas fa-brain"></i>
        <p>Jogo da Memória</p>
    </div>

   <!-- <div class="card" onclick="openPage('correcrc.html')">
        <i class="fas fa-running"></i>
        <p>Corre ao CRC</p>
    </div> -->

    <!-- Aqui podes adicionar mais jogos no futuro -->
</div>

<script>
    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
