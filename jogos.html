<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos — Lajeosa do Mondego</title>

    <!-- Carregar estilo global -->
    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="assets/brasao.png"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--verde-base);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 120px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: var(--dourado);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        .card {
            background-color: var(--cor-cartao-castanho-escuro);
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .card:hover {
            background-color: var(--cor-cartao-castanho-claro);
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        .card i {
            font-size: 36px;
            color: var(--dourado);
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
        }

        #voltar {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: var(--cor-cartao-castanho-escuro);
            color: var(--dourado);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        #voltar:hover {
            background-color: var(--cor-cartao-castanho-claro);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Jogos</h1>
    <button id="voltar" onclick="openPage('index.html')">← Voltar ao Menu</button>
</header>

<div class="grid">

    <div class="card" onclick="openPage('jogo-memoria.html')">
        <i class="fas fa-brain"></i>
        <p>Jogo da Memória</p>
    </div>

    <div class="card" onclick="openPage('crc_runner_vertical.html')">
        <i class="fas fa-running"></i>
        <p>Treino reflexos do CRC</p>
    </div>

    <div class="card" onclick="openPage('tiroaoalvo.html')">
        <i class="fas fa-bullseye"></i>
        <p>Tiro ao Alvo</p>
    </div>

</div>

<script>
    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
