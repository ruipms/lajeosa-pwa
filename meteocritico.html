<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteorologia Crítica – Lajeosa</title>

<link rel="stylesheet" href="style.css">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: var(--verde-base);
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        padding: 20px;
    }

    header img {
        width: 120px;
        display: block;
        margin: 0 auto;
    }

    h1 {
        margin-top: 10px;
        font-size: 24px;
        font-weight: bold;
        color: var(--dourado);
    }

    .btn-voltar {
        display: block;
        margin: 12px auto 0 auto;
        padding: 10px 18px;
        border-radius: 18px;
        background-color: var(--cor-cartao-castanho-escuro);
        border-left: 4px solid var(--dourado);
        color: var(--dourado);
        font-size: 15px;
        text-decoration: none;
        width: fit-content;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .btn-voltar:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 18px rgba(227,193,90,0.55);
    }

    .sec-title {
        color: var(--dourado);
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    /* Cartão base castanho */
    .card {
        background-color: var(--cor-cartao-castanho-escuro);
        padding: 18px;
        border-radius: 18px;
        margin: 16px 20px;
        text-align: left;
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
        position: relative;
    }

    /* Barra superior colorida */
    .card::before {
        content: "";
        display: block;
        height: 6px;
        border-radius: 6px 6px 0 0;
        margin-bottom: 10px;
    }

    .card.yellow::before { background-color: #FFD700; }
    .card.orange::before { background-color: #FFA500; }
    .card.red::before { background-color: #FF4D4D; }
    .card.green::before { background-color: #00CC66; }

    /* Título colorido */
    .titulo-yellow { color: #FFD700 !important; }
    .titulo-orange { color: #FFA500 !important; }
    .titulo-red { color: #FF4D4D !important; }
    .titulo-green { color: #00CC66 !important; }

    /* Ícone colorido */
    .icon-yellow { color: #FFD700 !important; }
    .icon-orange { color: #FFA500 !important; }
    .icon-red { color: #FF4D4D !important; }
    .icon-green { color: #00CC66 !important; }

    .status-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .status-desc {
        font-size: 15px;
        margin-top: 10px;
        line-height: 1.4;
    }

    .status-meta {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.9;
        color: var(--dourado);
    }

    .error-box {
        background-color: #8B0000;
        padding: 16px;
        border-radius: 18px;
        margin: 20px;
        border-left: 4px solid var(--dourado);
        font-size: 15px;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }
</style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
    <h1>Meteorologia Crítica</h1>
    <p style="color:var(--dourado); font-size:14px;">Fonte: IPMA – Avisos Oficiais</p>
</header>

<h2 class="sec-title">Estado Atual</h2>

<div id="conteudo"></div>

<script>
const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=meteo-ipma";

async function carregarAvisos() {
    const div = document.getElementById("conteudo");

    try {
        const resp = await fetch(WORKER_URL, { cache: "no-store" });
        const data = await resp.json();

        if (!resp.ok || !data.avisos) {
            div.innerHTML = `
                <div class="error-box">
                    Não foi possível carregar os avisos meteorológicos.<br>
                    Tente novamente dentro de alguns minutos.
                </div>`;
            return;
        }

        const avisos = data.avisos;

        if (avisos.length === 0) {
            div.innerHTML = `
                <div class="card green">
                    <div class="status-title titulo-green">
                        <i class="fa-solid fa-check-circle icon-green"></i>
                        Sem avisos ativos
                    </div>
                    <div class="status-desc">
                        Neste momento não existem avisos meteorológicos ativos para o distrito da Guarda.
                    </div>
                    <div class="status-meta">
                        <strong>Atualizado:</strong> ${new Date().toLocaleString("pt-PT")}
                    </div>
                </div>
            `;
            return;
        }

        let html = "";

        avisos.forEach(av => {

            const textoCompleto = (
                (av.awarenessTypeName || "") + " " +
                (av.text || "")
            ).toLowerCase();

            const ignorar = [
                "agitação","marítima","maritima","ondulação",
                "mar","costeiro","coastal","sea","wave"
            ];

            if (ignorar.some(p => textoCompleto.includes(p))) return;

            const tipo = av.awarenessTypeName || "Aviso";

            let nivel = av.awarenessLevelID;

            if (nivel === 1 || nivel === "1") nivel = "green";
            if (nivel === 2 || nivel === "2") nivel = "yellow";
            if (nivel === 3 || nivel === "3") nivel = "orange";
            if (nivel === 4 || nivel === "4") nivel = "red";

            const nivelPT =
                nivel === "yellow" ? "Amarelo" :
                nivel === "orange" ? "Laranja" :
                nivel === "red" ? "Vermelho" : "Verde";

            const texto = av.text && av.text.trim() !== ""
                ? av.text
                : `Aviso de ${tipo.toLowerCase()} nível ${nivelPT}.`;

            const inicio = av.startTime || "Sem início indicado.";
            const fim = av.endTime || "Sem fim indicado.";

            let icone = "fa-circle-info";
            if (tipo.includes("Precip")) icone = "fa-cloud-rain";
            if (tipo.includes("Vento")) icone = "fa-wind";
            if (tipo.includes("Trovoada")) icone = "fa-bolt";
            if (tipo.includes("Neve")) icone = "fa-snowflake";
            if (tipo.includes("Nevoeiro")) icone = "fa-smog";

            let iconeNivel = "fa-check-circle";
            if (nivel === "yellow") iconeNivel = "fa-triangle-exclamation";
            if (nivel === "orange") iconeNivel = "fa-exclamation-circle";
            if (nivel === "red") iconeNivel = "fa-skull-crossbones";

            const classeNivel =
                nivel === "yellow" ? "yellow" :
                nivel === "orange" ? "orange" :
                nivel === "red" ? "red" : "green";

            const classeTitulo =
                nivel === "yellow" ? "titulo-yellow" :
                nivel === "orange" ? "titulo-orange" :
                nivel === "red" ? "titulo-red" : "titulo-green";

            const classeIcone =
                nivel === "yellow" ? "icon-yellow" :
                nivel === "orange" ? "icon-orange" :
                nivel === "red" ? "icon-red" : "icon-green";

            html += `
                <div class="card ${classeNivel}">
                    <div class="status-title ${classeTitulo}">
                        <i class="fa-solid ${iconeNivel} ${classeIcone}"></i>
                        ${tipo} – ${nivelPT}
                    </div>

                    <div class="status-desc">
                        <i class="fa-solid ${icone}"></i>
                        ${texto}
                    </div>

                    <div class="status-meta">
                        <strong>Início:</strong> ${inicio}<br>
                        <strong>Fim:</strong> ${fim}<br>
                        <strong>Atualizado:</strong> ${new Date().toLocaleString("pt-PT")}
                    </div>
                </div>
            `;
        });

        div.innerHTML = html;

    } catch (e) {
        div.innerHTML = `
            <div class="error-box">
                Erro ao contactar o serviço de avisos.<br>
                Verifique a ligação à internet.
            </div>`;
    }
}

carregarAvisos();
</script>

<script>
function openPage(page) {
    window.location.href = page;
}
</script>

</body>
</html>
