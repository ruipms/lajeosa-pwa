<!-- Google Analytics (mesmo da index) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');

  /* 1) Instalação da PWA */
  window.addEventListener('appinstalled', () => {
      gtag('event', 'pwa_install', {
          event_category: 'PWA',
          event_label: 'Instalação da App'
      });
  });

  /* 2) Abertura via ícone */
  if (window.matchMedia('(display-mode: standalone)').matches) {
      gtag('event', 'pwa_launch_icon', {
          event_category: 'PWA',
          event_label: 'Abertura via ícone'
      });
  }

  /* 3) Primeira visita vs recorrente */
  if (!localStorage.getItem('pwa_first_visit')) {
      localStorage.setItem('pwa_first_visit', '1');
      gtag('event', 'pwa_first_open');
  } else {
      gtag('event', 'pwa_return_open');
  }

  /* 4) Uso offline */
  window.addEventListener('offline', () => {
      gtag('event', 'pwa_offline_use');
  });

  /* 5) Erro de rede */
  window.addEventListener('error', (e) => {
      if (e.message && e.message.includes('Failed to fetch')) {
          gtag('event', 'pwa_network_error');
      }
  });

  /* 6) Origem social */
  document.addEventListener('DOMContentLoaded', () => {
      const ref = document.referrer;
      if (ref.includes('whatsapp')) gtag('event', 'pwa_open_whatsapp');
      if (ref.includes('instagram')) gtag('event', 'pwa_open_instagram');
      if (ref.includes('facebook')) gtag('event', 'pwa_open_facebook');
  });

  /* 7) Atualização da PWA */
  if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
          gtag('event', 'pwa_update_trigger');
      });
  }

  /* 8) Atividade contínua */
  setInterval(() => {
      gtag('event', 'pwa_active_tick');
  }, 15000);
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #0F3D2E;
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        padding: 20px;
    }

    header img {
        width: 120px;
    }

    h1 {
        margin-top: 10px;
        font-size: 24px;
        font-weight: bold;
    }

    .top-btn {
        display: inline-block;
        margin-bottom: 10px;
        padding: 10px 18px;
        border-radius: 18px;
        background-color: #1F5C45;
        border: 1px solid #D4AF37;
        color: #D4AF37;
        font-size: 15px;
        text-decoration: none;
    }

    .top-btn:hover {
        background-color: #2a7a5e;
    }

    .sec-title {
        color: #D4AF37;
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    .card {
        background-color: #1F5C45;
        padding: 18px;
        border-radius: 18px;
        margin: 16px 20px;
        text-align: left;
        border: 1px solid rgba(212,175,55,0.4);
    }

    .card i {
        font-size: 32px;
        color: #D4AF37;
        margin-right: 10px;
    }

    .status-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .status-desc {

        margin-top: 10px;
        line-height: 1.4;
    }

    .status-meta {
        margin-top: 12px;

    }

    .error-box {
        background-color: #8B0000;

        border-radius: 18px;

        border: 1px solid #D4AF37;

    }
</style>

<body>

<header>
    <a class="top-btn" href="seguranca.html">← Voltar à Segurança</a>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa">
    <h1>Meteorologia Crítica</h1>
    <p style="color:#D4AF37; font-size:14px;">Fonte: IPMA – Avisos Oficiais</p>
</header>

<h2 class="sec-title">Estado Atual</h2>

<div id="conteudo"></div>

<script>
const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=meteo-ipma";

async function carregarAvisos() {
    const div = document.getElementById("conteudo");

    try {
        const resp = await fetch(WORKER_URL, { cache: "no-store" });
        const data = await resp.json();

        if (!resp.ok || !data.avisos) {
            div.innerHTML = `
                <div class="error-box">
                    Não foi possível carregar os avisos meteorológicos.<br>
                    Tente novamente dentro de alguns minutos.
                </div>`;
            return;
        }

        const avisos = data.avisos;

        if (avisos.length === 0) {
            div.innerHTML = `
                <div class="card">
                    <div class="status-title">
                        <i class="fa-solid fa-check-circle"></i>
                        Sem avisos ativos
                    </div>
                    <div class="status-desc">
                        Neste momento não existem avisos meteorológicos ativos para o distrito da Guarda.
                    </div>
                    <div class="status-meta">
                        <strong>Atualizado:</strong> ${new Date().toLocaleString("pt-PT")}
                    </div>
                </div>
            `;
            return;
        }

        let html = "";

        avisos.forEach(av => {
            const tipo = av.awarenessTypeName || "Aviso";
            const nivel = av.awarenessLevelID || "green";
            const texto = av.text || "Sem descrição disponível.";
            const inicio = av.startTime || "Sem início indicado.";
            const fim = av.endTime || "Sem fim indicado.";

            let icone = "fa-circle-info";
            if (tipo.includes("Precip")) icone = "fa-cloud-rain";
            if (tipo.includes("Vento")) icone = "fa-wind";
            if (tipo.includes("Trovoada")) icone = "fa-bolt";
            if (tipo.includes("Neve")) icone = "fa-snowflake";
            if (tipo.includes("Agitação")) icone = "fa-water";
            if (tipo.includes("Nevoeiro")) icone = "fa-smog";

            let iconeNivel = "fa-check-circle";
            if (nivel === "yellow") iconeNivel = "fa-triangle-exclamation";
            if (nivel === "orange") iconeNivel = "fa-exclamation-circle";
            if (nivel === "red") iconeNivel = "fa-skull-crossbones";

            const nivelPT =
                nivel === "yellow" ? "Amarelo" :
                nivel === "orange" ? "Laranja" :
                nivel === "red" ? "Vermelho" : "Verde";

            html += `
                <div class="card">
                    <div class="status-title">
                        <i class="fa-solid ${iconeNivel}"></i>
                        ${tipo} – ${nivelPT}
                    </div>

                    <div class="status-desc">
                        <i class="fa-solid ${icone}"></i>
                        ${texto}
                    </div>

                    <div class="status-meta">
                        <strong>Início:</strong> ${inicio}<br>
                        <strong>Fim:</strong> ${fim}<br>
                        <strong>Atualizado:</strong> ${new Date().toLocaleString("pt-PT")}
                    </div>
                </div>
            `;
        });

        div.innerHTML = html;

    } catch (e) {
        div.innerHTML = `
            <div class="error-box">
                Erro ao contactar o serviço de avisos.<br>
                Verifique a ligação à internet.
            </div>`;
    }
}

carregarAvisos();
</script>

</body>
</html>
