<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Meteorologia Crítica – Lajeosa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --verde: #1b5e20;
      --verde-claro: #2e7d32;
      --dourado: #c9a23f;
      --cinza-fundo: #121212;
      --cinza-card: #1e1e1e;
      --texto: #f5f5f5;
      --perigo-amarelo: #fbc02d;
      --perigo-laranja: #fb8c00;
      --perigo-vermelho: #e53935;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #263238 0, #0b0b0b 55%);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .page {
      max-width: 480px;
      width: 100%;
      background: linear-gradient(145deg, #101010, #181818);
      border-radius: 18px;
      border: 1px solid rgba(201, 162, 63, 0.35);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      padding: 18px 18px 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-name {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(201, 162, 63, 0.9);
    }

    .page-title {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(201, 162, 63, 0.5);
      font-size: 11px;
      color: rgba(245, 245, 245, 0.85);
      background: radial-gradient(circle at top, rgba(201, 162, 63, 0.25), rgba(0, 0, 0, 0.8));
    }

    .status-card {
      border-radius: 14px;
      padding: 14px 14px 12px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .status-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.18;
      pointer-events: none;
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .status-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .status-icon {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .status-text {
      font-size: 13px;
      line-height: 1.4;
      color: rgba(245, 245, 245, 0.9);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 11px;
      color: rgba(220, 220, 220, 0.8);
    }

    .meta-row span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(245, 245, 245, 0.7);
    }

    .link-block {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }

    .link-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(201, 162, 63, 0.5);
      background: radial-gradient(circle at top, rgba(201, 162, 63, 0.25), rgba(0, 0, 0, 0.9));
      color: rgba(245, 245, 245, 0.95);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .link-btn.secondary {
      border-color: rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.4);
      color: rgba(230, 230, 230, 0.9);
    }

    .footer-note {
      margin-top: 12px;
      font-size: 10px;
      color: rgba(200, 200, 200, 0.7);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .footer-note span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .severity-verde {
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
    }
    .severity-verde::before {
      background: radial-gradient(circle at top left, rgba(201, 162, 63, 0.25), transparent 55%);
    }

    .severity-amarelo {
      background: linear-gradient(135deg, #fbc02d, #f57f17);
    }
    .severity-amarelo::before {
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.25), transparent 55%);
    }

    .severity-laranja {
      background: linear-gradient(135deg, #fb8c00, #ef6c00);
    }
    .severity-laranja::before {
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.25), transparent 55%);
    }

    .severity-vermelho {
      background: linear-gradient(135deg, #e53935, #b71c1c);
    }
    .severity-vermelho::before {
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.25), transparent 55%);
    }

    .loading,
    .error {
      font-size: 13px;
      color: rgba(230, 230, 230, 0.9);
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="title-block">
        <div class="app-name">Lajeosa · Meteo</div>
        <div class="page-title">Meteorologia crítica</div>
      </div>
      <div class="badge">Fonte: avisos.pt · distrito Guarda</div>
    </header>

    <div id="state" class="loading">A carregar avisos meteorológicos…</div>

    <section id="card-container"></section>

    <div class="link-block">
      <a class="link-btn" href="https://avisos.pt/distrito/guarda" target="_blank" rel="noopener">
        <span>Ver detalhes em avisos.pt</span>
      </a>
      <a class="link-btn secondary" href="https://www.ipma.pt/pt/otempo/prev-sam/?p=GDA" target="_blank" rel="noopener">
        <span>Meteorologia completa (IPMA)</span>
      </a>
    </div>

    <div class="footer-note">
      <span>⚠️ Avisos sujeitos a atualização frequente.</span>
      <span id="updated-label">Última atualização: —</span>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://SEU-WORKER.workers.dev/?feed=meteo-guarda";

    function mapCorToClass(cor) {
      switch ((cor || "").toLowerCase()) {
        case "amarelo": return "severity-amarelo";
        case "laranja": return "severity-laranja";
        case "vermelho": return "severity-vermelho";
        default: return "severity-verde";
      }
    }

    function mapCorToLabel(cor) {
      switch ((cor || "").toLowerCase()) {
        case "amarelo": return "Aviso amarelo · atenção moderada";
        case "laranja": return "Aviso laranja · situação potencialmente perigosa";
        case "vermelho": return "Aviso vermelho · situação perigosa";
        default: return "Sem avisos meteorológicos ativos";
      }
    }

    function iconForCor(cor) {
      switch ((cor || "").toLowerCase()) {
        case "amarelo": return "⚠️";
        case "laranja": return "⚠️";
        case "vermelho": return "⛔";
        default: return "✅";
      }
    }

    async function loadMeteoCritico() {
      const stateEl = document.getElementById("state");
      const cardContainer = document.getElementById("card-container");
      const updatedLabel = document.getElementById("updated-label");

      stateEl.textContent = "A carregar avisos meteorológicos…";

      try {
        const resp = await fetch(WORKER_URL, { cache: "no-store" });
        if (!resp.ok) {
          throw new Error("Resposta inválida do serviço de avisos");
        }

        const data = await resp.json();

        const updated = data.updated || new Date().toISOString();
        const aviso = data.aviso || null;
        const avisoCor = data.avisoCor || "verde";
        const validade = data.validade || null;
        const descricao = data.descricao || null;

        updatedLabel.textContent = "Última atualização: " +
          new Date(updated).toLocaleString("pt-PT", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });

        stateEl.remove();

        const card = document.createElement("article");
        card.className = "status-card " + mapCorToClass(avisoCor);

        const header = document.createElement("div");
        header.className = "status-header";

        const title = document.createElement("div");
        title.className = "status-title";
        const icon = document.createElement("div");
        icon.className = "status-icon";
        icon.textContent = iconForCor(avisoCor);

        const titleText = document.createElement("span");
        titleText.textContent = aviso ? aviso : "Sem avisos meteorológicos";

        title.appendChild(icon);
        title.appendChild(titleText);

        const pill = document.createElement("div");
        pill.className = "status-pill";
        pill.textContent = mapCorToLabel(avisoCor);

        header.appendChild(title);
        header.appendChild(pill);

        const text = document.createElement("p");
        text.className = "status-text";

        if (!aviso) {
          text.textContent =
            "Neste momento não existem avisos meteorológicos ativos para o distrito da Guarda. " +
            "A circulação e atividades decorrem em condições normais, mantendo sempre a vigilância habitual.";
        } else {
          const desc = descricao
            ? descricao
            : "Aviso emitido para o distrito da Guarda. Recomenda-se atenção às condições meteorológicas.";
          text.textContent = desc;
        }

        const meta = document.createElement("div");
        meta.className = "meta-row";

        const left = document.createElement("span");
        const dot = document.createElement("span");
        dot.className = "dot";
        left.appendChild(dot);
        const leftText = document.createElement("span");
        leftText.textContent = aviso ? "Aviso ativo para o distrito da Guarda" : "Sem avisos ativos para o distrito da Guarda";
        left.appendChild(leftText);

        const right = document.createElement("span");
        right.textContent = validade
          ? "Válido: " + validade
          : "Validade: não especificada";

        meta.appendChild(left);
        meta.appendChild(right);

        card.appendChild(header);
        card.appendChild(text);
        card.appendChild(meta);

        cardContainer.innerHTML = "";
        cardContainer.appendChild(card);
      } catch (err) {
        console.error(err);
        stateEl.className = "error";
        stateEl.textContent =
          "Não foi possível carregar os avisos meteorológicos neste momento. " +
          "Tente novamente dentro de alguns minutos.";
      }
    }

    loadMeteoCritico();
  </script>
</body>
</html>
