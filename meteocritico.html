<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteorologia Crítica – Lajeosa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #0F3D2E;
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        padding: 20px;
    }

    header img {
        width: 120px;
    }

    h1 {
        margin-top: 10px;
        font-size: 24px;
        font-weight: bold;
    }

    .sec-title {
        color: #D4AF37;
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    .card {
        background-color: #1F5C45;
        padding: 18px;
        border-radius: 18px;
        margin: 16px 20px;
        text-align: left;
        border: 1px solid rgba(212,175,55,0.4);
    }

    .card i {
        font-size: 32px;
        color: #D4AF37;
        margin-right: 10px;
    }

    .status-title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .status-desc {
        font-size: 15px;
        margin-top: 10px;
        line-height: 1.4;
    }

    .status-meta {
        margin-top: 12px;
        font-size: 13px;
        opacity: 0.9;
    }

    .btn {
        display: block;
        margin: 14px auto;
        width: 80%;
        padding: 12px;
        border-radius: 18px;
        background-color: #1F5C45;
        border: 1px solid #D4AF37;
        color: #D4AF37;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
    }

    .btn:hover {
        background-color: #2a7a5e;
    }

    .error-box {
        background-color: #8B0000;
        padding: 16px;
        border-radius: 18px;
        margin: 20px;
        border: 1px solid #D4AF37;
        font-size: 15px;
    }
</style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa">
    <h1>Meteorologia Crítica</h1>
    <p style="color:#D4AF37; font-size:14px;">Fonte: IPMA – Avisos Oficiais</p>
</header>

<h2 class="sec-title">Estado Atual</h2>

<div id="conteudo"></div>

<a class="btn" href="https://www.ipma.pt/pt/otempo/prev-simples/" target="_blank">
    Ver detalhes no IPMA
</a>

<a class="btn" href="meteorologia.html">
    Voltar à Meteorologia Normal
</a>

<script>
const WORKER_URL = "https://SEU-WORKER.workers.dev/?feed=meteo-ipma";

async function carregarAvisos() {
    const div = document.getElementById("conteudo");

    try {
        const resp = await fetch(WORKER_URL, { cache: "no-store" });
        const data = await resp.json();

        if (data.error || !resp.ok) {
            div.innerHTML = `
                <div class="error-box">
                    Não foi possível carregar os avisos meteorológicos.<br>
                    Tente novamente dentro de alguns minutos.
                </div>`;
            return;
        }

        const aviso = data.aviso;
        const cor = data.cor || "verde";
        const desc = data.descricao || "Sem descrição disponível.";
        const inicio = data.inicio || "Sem início indicado.";
        const fim = data.fim || "Sem fim indicado.";

        // Ícones por nível IPMA
        let icone = "fa-check-circle";
        if (cor === "yellow") icone = "fa-triangle-exclamation";
        if (cor === "orange") icone = "fa-exclamation-circle";
        if (cor === "red") icone = "fa-skull-crossbones";

        // Converter nomes IPMA para PT
        const corPT =
            cor === "yellow" ? "Amarelo" :
            cor === "orange" ? "Laranja" :
            cor === "red" ? "Vermelho" : "Verde";

        div.innerHTML = `
            <div class="card">
                <div class="status-title">
                    <i class="fa-solid ${icone}"></i>
                    ${aviso !== "Nenhum" ? `${aviso} – ${corPT}` : "Sem avisos ativos"}
                </div>

                <div class="status-desc">
                    ${aviso !== "Nenhum" ? desc : "Neste momento não existem avisos meteorológicos ativos para o distrito da Guarda."}
                </div>

                <div class="status-meta">
                    ${aviso !== "Nenhum" ? `
                        <strong>Início:</strong> ${inicio}<br>
                        <strong>Fim:</strong> ${fim}<br>
                    ` : ""}
                    <strong>Atualizado:</strong> ${new Date().toLocaleString("pt-PT")}
                </div>
            </div>
        `;
    } catch (e) {
        div.innerHTML = `
            <div class="error-box">
                Erro ao contactar o serviço de avisos.<br>
                Verifique a ligação à internet.
            </div>`;
    }
}

carregarAvisos();
</script>

</body>
</html>
