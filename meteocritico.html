<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Meteorologia Crítica – Distrito da Guarda</title>
<style>
  body {
    background: #0b2e1f;
    color: #f2d96b;
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  .card {
    background: #13452c;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
  }
  .verde { border-left: 10px solid #4caf50; }
  .amarelo { border-left: 10px solid #f7e600; }
  .laranja { border-left: 10px solid #ff9800; }
  .vermelho { border-left: 10px solid #f44336; }
</style>
</head>
<body>

<h2>Meteorologia Crítica – Distrito da Guarda</h2>

<div id="alerta" class="card verde">
  <h3 id="tipo">A carregar aviso...</h3>
  <p id="validade"></p>
</div>

<script>
const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=meteo-guarda";

async function carregarAviso() {
  try {
    const resp = await fetch(WORKER_URL);
    const dados = await resp.json();

    const card = document.getElementById("alerta");
    const tipo = document.getElementById("tipo");
    const validade = document.getElementById("validade");

   if (!dados.aviso) {
  card.className = "card verde";

  tipo.innerHTML = `
    🌤️ Sem avisos meteorológicos para o distrito da Guarda.
  `;

  validade.innerHTML = `
    <a href="meteorologia.html" style="color:#D4AF37; text-decoration:none;">
      Ver previsão normal →
    </a>
  `;

  return;
}


    tipo.textContent = dados.aviso;
    validade.textContent = dados.validade || "";
    card.className = "card " + dados.avisoCor;

  } catch (e) {
    document.getElementById("tipo").textContent = "Erro ao carregar meteorologia crítica.";
  }
}

carregarAviso();
</script>

</body>
</html>
