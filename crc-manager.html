<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRC Manager</title>

<link rel="stylesheet" href="style.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-FTEGNRDBJW');
</script>

<style>

.card-jogo{
    background-color: var(--cor-cartao-castanho-escuro);
    border-left:4px solid var(--dourado);
    border-radius:18px;
    margin:16px 20px;
    padding:18px;
    box-shadow:0 0 12px rgba(227,193,90,0.35);
}

.estatisticas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.estat{
    background:rgba(255,255,255,0.05);
    padding:12px;
    border-radius:12px;
}

.estat strong{
    display:block;
    font-size:24px;
    color:var(--dourado);
}

.btn-jogar{
    display:block;
    width:100%;
    margin-top:15px;
    padding:14px;
    background:var(--dourado);
    color:black;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}

.btn-jogar:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

.plantel-item{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.plantel-item:last-child{
    border-bottom:none;
}

.resultado{
    text-align:center;
    font-size:20px;
    margin-top:15px;
}

.resumo-dinheiro{
    font-size:15px;
    margin-top:12px;
    padding:10px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    line-height:1.7;
}

.outros-jogos{
    margin-top:14px;
    font-size:14px;
    opacity:0.85;
}

.outro-jogo{
    padding:4px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.outro-jogo:last-child{
    border-bottom:none;
}

.vitoria{
    color:#00cc66;
}

.empate{
    color:#ffcc00;
}

.derrota{
    color:#ff6666;
}

/* Classificação */
.tabela-scroll{
    overflow-x:auto;
}

.linha-tab{
    display:grid;
    grid-template-columns:30px minmax(90px,1fr) 24px 24px 24px 24px 34px 34px;
    gap:4px;
    align-items:center;
    padding:8px 4px;
    border-bottom:1px solid rgba(255,255,255,.1);
    font-size:14px;
    text-align:center;
    min-width:300px;
}

.linha-tab:last-child{
    border-bottom:none;
}

.linha-tab .nome-eq{
    text-align:left;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.linha-tab.cab{
    font-size:12px;
    opacity:0.7;
}

.linha-tab.meu-clube{
    background:rgba(227,193,90,0.18);
    border-radius:8px;
    color:var(--dourado);
    font-weight:bold;
}

/* Animações do dinheiro no topo */
.flash-perda{
    animation:flashPerda 1s ease;
}

.flash-ganho{
    animation:flashGanho 1s ease;
}

@keyframes flashPerda{
    0%   { color:#ff6666; transform:scale(1.25); }
    100% { transform:scale(1); }
}

@keyframes flashGanho{
    0%   { color:#00cc66; transform:scale(1.25); }
    100% { transform:scale(1); }
}

</style>

</head>

<body>

<div style="padding:15px;">
    <button class="btn-voltar"
            onclick="window.location.href='index.html'">

        ← Voltar

    </button>
</div>

<header style="text-align:center;">

    <h1>⚽ CRC Manager</h1>

    <p style="color:var(--dourado);">
        Leva o CRC Lajeosa ao topo
    </p>

</header>

<div class="card-jogo">

    <div class="estatisticas">

        <div class="estat">
            <strong id="dinheiro">5000€</strong>
            Dinheiro
        </div>

        <div class="estat">
            <strong id="pontos">0</strong>
            Pontos
        </div>

        <div class="estat">
            <strong id="jornada">1</strong>
            Jornada
        </div>

    </div>

</div>

<div class="card-jogo">

    <h2>👥 Plantel</h2>

    <div id="plantel"></div>
</div>

<div class="card-jogo">

    <h2>🏋️ Treino Semanal</h2>

    <select id="treino" onchange="mostrarTreino()">

        <option value="ofensivo">
            ⚔️ Ofensivo
        </option>

        <option value="defensivo">
            🛡️ Defensivo
        </option>

        <option value="fisico">
            🏃 Físico
        </option>

        <option value="moral">
            😊 Moral
        </option>

    </select>

    <p id="infoTreino"></p>

</div>

<div class="card-jogo">

    <h2>📅 Próximo jogo</h2>

    <div id="adversario"></div>

    <button class="btn-jogar"
            id="btnJogar"
            onclick="jogarJornada()">

        ▶️ Jogar Jornada

    </button>

    <div id="resultado"
         class="resultado">

    </div>

</div>

<div class="card-jogo">

    <h2>🏆 Classificação</h2>

    <div id="classificacao" class="tabela-scroll"></div>

</div>

<div class="card-jogo">

    <button class="btn-jogar"
            onclick="reiniciar()">

        🔄 Nova Carreira

    </button>

</div>

<script src="crc-manager.js"></script>

</body>
</html>
