<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias</title>

<style>
    body {
        background-color: #0F3D2E;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h2 {
        margin-bottom: 10px;
    }

    h3 {
        margin-top: 30px;
        margin-bottom: 10px;
        color: #D4AF37;
    }

    p {
        margin-bottom: 20px;
    }

    ul {
        list-style: none;
        padding: 0;
    }

    li {
        margin-bottom: 10px;
        background-color: #134C3A;
        padding: 10px;
        border-radius: 6px;
    }

    a {
        color: #D4AF37;
        text-decoration: none;
        font-size: 16px;
    }

    a:hover {
        text-decoration: underline;
    }

    .voltar {
        display: inline-block;
        margin-top: 30px;
        color: #D4AF37;
        font-size: 18px;
    }

    .mensagem {
        font-size: 14px;
        color: #cccccc;
    }
</style>
</head>
<body>

<h2>Notícias da Região</h2>
<p>Últimas publicações de fontes regionais.</p>

<!-- Beira.pt -->
<h3>Beira.pt</h3>
<ul id="noticias-beira">
    <li>A carregar notícias...</li>
</ul>

<!-- Freguesia da Guarda -->
<h3>Freguesia da Guarda</h3>
<ul id="noticias-freguesia">
    <li>A carregar notícias...</li>
</ul>

<a class="voltar" href="index.html">← Voltar</a>

<script>
async function carregarFeed(url, elementoId, maxItems = 3) {
    const lista = document.getElementById(elementoId);

    try {
        const resposta = await fetch(url);
        const texto = await resposta.text();

        const parser = new DOMParser();
        const xml = parser.parseFromString(texto, "text/xml");

        const items = xml.querySelectorAll("item");

        lista.innerHTML = "";

        items.forEach((item, index) => {
            if (index < maxItems) {
                const titulo = item.querySelector("title")?.textContent || "Sem título";
                const link = item.querySelector("link")?.textContent || "#";

                const li = document.createElement("li");
                li.innerHTML = `<a href="${link}" target="_blank">${titulo}</a>`;
                lista.appendChild(li);
            }
        });

        if (items.length === 0) {
            lista.innerHTML = "<li class='mensagem'>Nenhuma notícia encontrada.</li>";
        }
    } catch (erro) {
        lista.innerHTML = "<li class='mensagem'>Erro ao carregar notícias.</li>";
    }
}

// Beira.pt
carregarFeed("https://rss.app/feeds/pChXcF6RcAGHnL02.xml", "noticias-beira", 3);

// Freguesia da Guarda
carregarFeed("https://www.freguesiadaguarda.pt/rss-feed", "noticias-freguesia", 3);

</script>

</body>
</html>
