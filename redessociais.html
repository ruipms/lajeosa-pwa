<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lajeosa nas Redes Sociais</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <!-- Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: var(--verde-base);
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        h2 {
            color: var(--dourado);
            margin-bottom: 10px;
        }

        p.subtitle {
            opacity: 0.9;
            margin-bottom: 30px;
            font-size: 18px;
        }

        /* Grelha responsiva */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Ajuste dos cartões dentro da grelha */
        .social-grid .card {
            width: 100%;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center !important;
            cursor: pointer;
        }

        .social-grid .card i {
            font-size: 60px;
            color: var(--dourado);
            margin-bottom: 10px;
        }

        .icon-label {
            font-size: 18px;
            color: var(--dourado);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .voltar {
            display: inline-block;
            margin-top: 30px;
            color: var(--dourado);
            font-size: 18px;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h2>Lajeosa do Mondego nas Redes Sociais</h2>
<p class="subtitle">Carregue no símbolo da rede social para abrir a respetiva página.</p>

<div class="social-grid">

    <!-- Grupo da Lajeosa -->
    <a href="https://www.facebook.com/groups/178632112150037" target="_blank">
        <div class="card">
            <i class="fab fa-facebook"></i>
            <div class="icon-label">Grupo da Lajeosa</div>
        </div>
    </a>

    <!-- Junta de Freguesia -->
    <a href="https://www.facebook.com/lajeosadomondego" target="_blank">
        <div class="card">
            <i class="fab fa-facebook"></i>
            <div class="icon-label">Junta de Freguesia</div>
        </div>
    </a>

    <!-- CRC -->
    <a href="https://www.facebook.com/p/CRC-Lajeosa-do-Mondego-61576945611396/" target="_blank">
        <div class="card">
            <i class="fab fa-facebook"></i>
            <div class="icon-label">CRC Lajeosa</div>
        </div>
    </a>

    <!-- Página não oficial -->
    <a href="https://www.facebook.com/lageosamondego/" target="_blank">
        <div class="card">
            <i class="fab fa-facebook"></i>
            <div class="icon-label">Página não oficial</div>
        </div>
    </a>

    <!-- X -->
    <a href="https://x.com/Lagmondego" target="_blank">
        <div class="card">
            <i class="fab fa-x-twitter"></i>
            <div class="icon-label">Lajeosa no X</div>
        </div>
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/lageosa_do_mondego?igsh=MXAyMHZmb2ludGt2aw==" target="_blank">
        <div class="card">
            <i class="fab fa-instagram"></i>
            <div class="icon-label">Lajeosa no Instagram</div>
        </div>
    </a>

    <!-- WhatsApp -->
    <a href="https://whatsapp.com/channel/0029Vb82Q4v8PgsKSqxQHb46" target="_blank">
        <div class="card">
            <i class="fab fa-whatsapp"></i>
            <div class="icon-label">Canal WhatsApp</div>
        </div>
    </a>

    <!-- Telegram -->
    <a href="https://t.me/+3ePMiWdS-9NmMDI0" target="_blank">
        <div class="card">
            <i class="fab fa-telegram"></i>
            <div class="icon-label">Canal Telegram</div>
        </div>
    </a>

</div>

<a class="voltar" href="index.html">← Voltar</a>

</body>
</html>
