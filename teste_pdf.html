<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste PDF DGAV</title>

<style>

body{
  font-family:Arial,sans-serif;
  padding:20px;
  background:#0b5d42;
  color:white;
}

h1{
  color:#e3c15a;
}

button{
  background:#e3c15a;
  color:black;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

#estado{
  margin-top:15px;
  color:#ffd966;
}

#resultado{
  margin-top:20px;
  background:white;
  color:black;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  min-height:250px;
  max-height:600px;
  overflow:auto;
}

</style>
</head>

<body>

<h1>📖 Teste PDF DGAV</h1>

<button onclick="lerPDF()">
📖 Ler Circular nº 12
</button>

<div id="estado">
A aguardar...
</div>

<div id="resultado">
O texto aparecerá aqui.
</div>

<script type="module">

import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs';

window.lerPDF = async function(){

  const PDF_URL =
  "https://snaabackoffice.dgav.pt/snaabackoffice/Content/docs/circulares/Circular%20n%C2%BA%2012%20Guarda.pdf";

  const estado =
  document.getElementById("estado");

  const resultado =
  document.getElementById("resultado");

  try{

      estado.textContent =
      "📄 A descarregar PDF...";

      const pdf =
      await pdfjsLib.getDocument(PDF_URL).promise;

      let texto = "";

      for(let i=1;i<=pdf.numPages;i++){

          estado.textContent =
          `📖 A processar página ${i}/${pdf.numPages}`;

          const page =
          await pdf.getPage(i);

          const content =
          await page.getTextContent();

          texto += content.items
            .map(item => item.str)
            .join(" ");

          texto += "\n\n";
      }

      resultado.textContent =
      texto;

      estado.textContent =
      "✅ Extração concluída";

  }
  catch(err){

      console.error(err);

      estado.textContent =
      "❌ Erro";

      resultado.textContent =
      err.message;

  }

}

</script>

</body>
</html>
