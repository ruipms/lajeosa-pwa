<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRC Lajeosa do Mondego</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #0F3D2E;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    .club-logo {
      width: 140px;
    }

    .back-button {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: #D4AF37;
      font-weight: bold;
    }

    /* Aviso no topo (dinâmico) */
    .alert-avisos {
      background-color: #154f3c;
      color: #D4AF37;
      padding: 12px;
      margin: 10px 20px;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      display: none; /* começa escondido */
    }

    .content {
      padding: 20px;
    }

    .card {
      background-color: #1F5C45;
      padding: 14px;
      border-radius: 18px;
      margin-bottom: 20px;
      text-align: left;
      color: white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .card h3 {
      margin-top: 0;
      color: #D4AF37;
    }

    .grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* força 2 colunas */
  gap: 16px;
  margin-top: 20px;
}

    .menu-card {
      background-color: #1F5C45;
      padding: 20px;
      border-radius: 18px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      margin-bottom: 20px;
    }

    .menu-card:hover {
      background-color: #2a7a5e;
    }

    .menu-card i {
      font-size: 40px;
      color: #D4AF37;
    }

    .menu-card p {
      margin-top: 10px;
      font-size: 18px;
    }

    /* Imagens pequenas dos avisos */
    .notice-img {
      width: 60%;
      max-width: 250px;
      border-radius: 10px;
      margin: 10px auto;
      display: block;
      cursor: pointer;
      border: 2px solid #D4AF37;
    }

    /* Modal */
    #imgModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    /* Imagem grande */
    #imgModal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      pointer-events: none; /* compatibilidade Edge */
    }

    /* Botão X */
    .close-btn {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    .avisos {
      margin-top: 30px;
    }
</style>
</head>

<body>

<header>
    <img src="assets/CRC Lajeosa logo.jpg" class="club-logo">
    <h1>CRC Lajeosa do Mondego</h1>
    <a href="index.html" class="back-button">⬅ Voltar</a>
</header>

<!-- Aviso no topo (dinâmico) -->
<div id="alertAvisos" class="alert-avisos">
  📢 Existem avisos ativos no final da página.
</div>

<div class="content">

<!-- História + Órgãos Sociais (2 colunas) -->
<h3 style="color:#D4AF37; margin-top:20px;">📘 Clube</h3>

<div class="grid">

  <!-- História do Clube -->
  <div class="menu-card" onclick="openPage('historia_clube.html')">
    <i class="fas fa-book"></i>
    <p>História do Clube</p>
  </div>

  <!-- Órgãos Sociais -->
  <div class="menu-card" onclick="openPage('orgaos.html')">
    <i class="fas fa-landmark"></i>
    <p>Órgãos Sociais</p>
  </div>

</div>

<!-- Menu das Equipas -->
<h3 style="color:#D4AF37; margin-top:30px;">⚽ Equipas do Clube</h3>

<div class="grid">

  <!-- Linha 1 -->
  <div class="menu-card" onclick="openPage('clube_masculino.html')">
    <i class="fas fa-male"></i>
    <p>Equipa Masculina</p>
  </div>

  <div class="menu-card" onclick="openPage('clube_feminino.html')">
    <i class="fas fa-female"></i>
    <p>Equipa Feminina</p>
  </div>

  <!-- Linha 2 -->
  <div class="menu-card" onclick="openPage('clube_formacao.html')">
    <i class="fas fa-users"></i>
    <p>Futsal Formação</p>
  </div>

  <div class="menu-card" onclick="openPage('clube_historico.html')">
    <i class="fas fa-chart-line"></i>
    <p>Histórico da Competição</p>
  </div>

</div>

<!-- Avisos do Clube -->
<div class="card avisos">
  <h3>📢 Avisos do Clube</h3>

  <!--<img src="assets/IMG-20260817-WA0000.jpg" alt="Aviso 1" class="notice-img" onclick="openModal(this.src)"> -->
  <img src="assets/noitecrc.jpg" alt="Aviso 2" class="notice-img" onclick="openModal(this.src)"> 
  <!--<img src="assets/aviso3.jpg" alt="Aviso 3" class="notice-img" onclick="openModal(this.src)"> -->
</div>

</div>

<!-- Modal -->
<div id="imgModal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">✖</span>
  <img id="modalImg" src="">
</div>

<script>
function openPage(page) {
    window.location.href = page;
}

function openModal(src) {
  document.getElementById("modalImg").src = src;
  document.getElementById("imgModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("imgModal").style.display = "none";
}

/* Aviso dinâmico */
window.onload = function() {
    const avisos = document.querySelectorAll(".notice-img");
    const alerta = document.getElementById("alertAvisos");

    if (avisos.length > 0) {
        alerta.style.display = "block"; // mostra aviso
    } else {
        alerta.style.display = "none"; // esconde aviso
    }
};
</script>

</body>
</html>
