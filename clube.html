<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRC Lajeosa do Mondego</title>
  <link rel="stylesheet" href="style.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--verde-base);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    .club-logo {
      width: 140px;
    }

    .back-button {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: var(--dourado);
      font-weight: bold;
    }

    /* Aviso no topo */
    .alert-avisos {
      background-color: var(--cor-cartao-base);
      color: var(--dourado);
      padding: 12px;
      margin: 10px 20px;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      display: none;
      border-left: 4px solid var(--dourado);
    }

    .content {
      padding: 20px;
    }

    /* Cartão premium (avisos) */
    .card {
      background-color: var(--cor-cartao-base) !important;
      padding: 18px !important;
      border-radius: 20px !important;
      margin-bottom: 20px !important;
      text-align: left !important;
      color: white !important;
      border: 1px solid rgba(227,193,90,0.4) !important;
      box-shadow: 0 0 12px rgba(227,193,90,0.35) !important;
      border-left: 4px solid var(--dourado) !important;
    }

    .card h3 {
      margin-top: 0;
      color: var(--dourado);
    }

    /* Grelha 2 colunas */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    /* Cartões do menu (História, Órgãos, Equipas) */
    .menu-card {
      background-color: var(--cor-cartao-base) !important;
      padding: 18px !important;
      border-radius: 20px !important;
      text-align: center !important;
      cursor: pointer;
      transition: 0.25s !important;
      border: 1px solid rgba(227,193,90,0.4) !important;
      box-shadow: 0 0 12px rgba(227,193,90,0.35) !important;
      border-left: 4px solid var(--dourado) !important;
    }

    .menu-card:hover {
      background-color: var(--cor-cartao-base-hover) !important;
      transform: translateY(-4px) !important;
      box-shadow: 0 0 18px rgba(227,193,90,0.55) !important;
    }

    .menu-card i {
      font-size: 40px;
      color: var(--dourado) !important;
    }

    .menu-card p {
      margin-top: 10px;
      font-size: 18px;
      color: white !important;
    }

    /* Imagens dos avisos */
    .notice-img {
      width: 60%;
      max-width: 250px;
      border-radius: 10px;
      margin: 10px auto;
      display: block;
      cursor: pointer;
      border: 2px solid var(--dourado);
    }

    /* Modal */
    #imgModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    #imgModal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      pointer-events: none;
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    .avisos {
      margin-top: 30px;
    }
</style>
</head>

<body>

<header>
    <img src="assets/CRC Lajeosa logo.jpg" class="club-logo">
    <h1>CRC Lajeosa do Mondego</h1>
    <a href="index.html" class="back-button">⬅ Voltar</a>
</header>

<!-- Aviso no topo -->
<div id="alertAvisos" class="alert-avisos">
  📢 Existem avisos ativos no final da página.
</div>

<div class="content">

<!-- História + Órgãos Sociais -->
<h3 style="color:var(--dourado); margin-top:20px;">📘 Clube</h3>

<div class="grid">

  <div class="menu-card" onclick="openPage('historia_clube.html')">
    <i class="fas fa-book"></i>
    <p>História do Clube</p>
  </div>

  <div class="menu-card" onclick="openPage('orgaos.html')">
    <i class="fas fa-landmark"></i>
    <p>Órgãos Sociais</p>
  </div>

</div>

<!-- Equipas -->
<h3 style="color:var(--dourado); margin-top:30px;">⚽ Equipas do Clube</h3>

<div class="grid">

  <div class="menu-card" onclick="openPage('clube_masculino.html')">
    <i class="fas fa-male"></i>
    <p>Equipa Masculina</p>
  </div>

  <div class="menu-card" onclick="openPage('clube_feminino.html')">
    <i class="fas fa-female"></i>
    <p>Equipa Feminina</p>
  </div>

  <div class="menu-card" onclick="openPage('clube_formacao.html')">
    <i class="fas fa-users"></i>
    <p>Futsal Formação</p>
  </div>

</div>

<!-- Avisos -->
<div class="card avisos">
  <h3>📢 Avisos do Clube</h3>

  <img src="assets/convocatoria.jpg" alt="Aviso 1" class="notice-img" onclick="openModal(this.src)">
  <img src="assets/reg1.jpg" alt="Aviso 2" class="notice-img" onclick="openModal(this.src)">
  <img src="assets/reg2.jpg" alt="Aviso 3" class="notice-img" onclick="openModal(this.src)">
  <img src="assets/reg3.jpg" alt="Aviso 4" class="notice-img" onclick="openModal(this.src)">
</div>

</div>

<!-- Modal -->
<div id="imgModal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">✖</span>
  <img id="modalImg" src="">
</div>

<script>
function openPage(page) {
    window.location.href = page;
}

function openModal(src) {
  document.getElementById("modalImg").src = src;
  document.getElementById("imgModal").style.display = "flex";
}

function closeModal() {
  document.getElementById("imgModal").style.display = "none";
}

window.onload = function() {
    const avisos = document.querySelectorAll(".notice-img");
    const alerta = document.getElementById("alertAvisos");

    alerta.style.display = avisos.length > 0 ? "block" : "none";
};
</script>

</body>
</html>
