<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backoffice — Administração</title>

    <style>
        body {
            background-color: #0F3D2E;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        h2 {
            color: #D4AF37;
            margin-bottom: 10px;
        }

        p.subtitle {
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .card {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 20px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.25);
        }

        .card h3 {
            color: #D4AF37;
            margin-top: 0;
            margin-bottom: 10px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        button {
            background-color: #D4AF37;
            color: #0F3D2E;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .voltar {
            display: inline-block;
            margin-top: 30px;
            color: #D4AF37;
            font-size: 18px;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<script>
if (localStorage.getItem("admin") !== "true") {
    window.location.href = "login.html";
}

function logout() {
    localStorage.removeItem("admin");
    window.location.href = "login.html";
}
</script>


<h2>Backoffice — Administração</h2>
<p class="subtitle">Escolhe a página que queres alterar.</p>

<!-- Seleção da página -->
<div class="card">
    <h3>📄 Selecionar página</h3>

    <select id="pagina">
        <option value="">— Escolher página —</option>
        <option value="junta">Junta de Freguesia</option>
        <option value="servicos">Serviços</option>
        <option value="eventos">Eventos</option>
        <option value="equipa_masc">Equipa Sénior Masculina</option>
        <option value="equipa_fem">Equipa Sénior Feminina</option>
        <option value="contactos">Contactos</option>
    </select>


    <button onclick="mostrarOpcoes()">Continuar</button>
</div>

<!-- Opções de edição -->
<div id="opcoes" class="card" style="display:none;">
    <h3>⚙️ Alterar conteúdo</h3>

    <p id="paginaEscolhida" style="color:#D4AF37; font-weight:bold; margin-bottom:15px;"></p>

    <button onclick="editarTexto()">Alterar Texto</button>
    <button onclick="editarImagem()">Alterar Imagem</button>
</div>

<button onclick="logout()" style="margin-top:20px;">
    Logout
</button>


<a class="voltar" href="index.html">← Voltar</a>

<script>
if (localStorage.getItem("admin") !== "true") {
    window.location.replace("login.html");
}

let paginaSelecionada = "";

function mostrarOpcoes() {
    const pagina = document.getElementById("pagina").value;

    if (!pagina) {
        alert("Escolhe uma página primeiro.");
        return;
    }

    paginaSelecionada = pagina;
    document.getElementById("opcoes").style.display = "block";
    document.getElementById("paginaEscolhida").innerText =
    "Página selecionada: " + paginaSelecionada.replace("_", " ");

}

function editarTexto() {
    window.location.href = "pagina_texto.html?target=" + paginaSelecionada;
}

function editarImagem() {
    window.location.href = "pagina_imagem.html?target=" + paginaSelecionada;
}

function logout() {
    localStorage.removeItem("admin");
    window.location.href = "login.html";
}
</script>


</body>
</html>
