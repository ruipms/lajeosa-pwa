<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agrometeorologia</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --verde:#0f4d36;
    --verde-card:#1d5f46;
    --dourado:#e3c15a;
    --castanho:#3f2a1d;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--verde);
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:25px 15px;
}

h1{
    margin:0;
    color:var(--dourado);
}

.subtitulo{
    margin-top:8px;
    color:#ddd;
}

.stats{
    margin:20px;
    padding:15px;
    background:var(--castanho);
    border-left:5px solid var(--dourado);
    border-radius:12px;
    text-align:center;
}

.stats strong{
    color:var(--dourado);
    font-size:24px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.boletim{
    background:var(--castanho);
    border-left:5px solid var(--dourado);
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.boletim h2{
    color:var(--dourado);
    margin-top:0;
}

.secao{
    margin-top:15px;
}

.secao h3{
    margin-bottom:10px;
    color:var(--dourado);
}

.lista{
    line-height:1.8;
}

.badge{
    display:inline-block;
    background:#854f00;
    color:#fff;
    padding:6px 12px;
    border-radius:20px;
    margin-top:10px;
}

.pdf-btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 15px;
    background:var(--dourado);
    color:black;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.loading{
    text-align:center;
    padding:40px;
    color:white;
}

.vazio{
    text-align:center;
    padding:25px;
    background:var(--castanho);
    border-radius:12px;
}

</style>
</head>

<body>

<header>

<h1>
🌱 Agrometeorologia
</h1>

<div class="subtitulo">
Avisos Agrícolas Oficiais da Guarda
</div>

</header>

<div id="contador" class="stats">

A carregar...

</div>

<div id="boletins" class="container">

<div class="loading">

A carregar boletins agrícolas...

</div>

</div>

<script>

const API =
"https://TEU-WORKER.workers.dev/?feed=agrometeo";

function criarLista(texto){

    return texto
      .split(",")
      .map(item => item.trim())
      .filter(item => item)
      .map(item => `<li>${item}</li>`)
      .join("");

}

async function carregar(){

    const container =
      document.getElementById("boletins");

    const contador =
      document.getElementById("contador");

    try{

        const resp =
          await fetch(API);

        const dados =
          await resp.json();

        contador.innerHTML = `
            <strong>
                ${dados.totalBoletins}
            </strong>
            <br>
            boletins ativos da EA da Guarda
        `;

        if(!dados.boletins ||
           !dados.boletins.length){

            container.innerHTML = `

                <div class="vazio">

                    ✅ Não existem boletins ativos
                    para a Guarda.

                </div>

            `;

            return;
        }

        let html = "";

        dados.boletins.forEach(b => {

            html += `

            <div class="boletim">

                <h2>
                    📄 ${b.circular}
                </h2>

                <div class="badge">
                    ${b.ea}
                </div>

                <div class="secao">

                    <h3>

                        🌾 Culturas

                    </h3>

                    <ul class="lista">

                        ${criarLista(b.cultura)}

                    </ul>

                </div>

                <div class="secao">

                    <h3>

                        🦠 Pragas e Doenças

                    </h3>

                    <ul class="lista">

                        ${criarLista(b.inimigos)}

                    </ul>

                </div>

                <a
                    class="pdf-btn"
                    href="${b.pdf}"
                    target="_blank">

                    📄 Abrir Circular

                </a>

            </div>

            `;

        });

        container.innerHTML = html;

    }
    catch(err){

        container.innerHTML = `

            <div class="vazio">

                ❌ Erro ao carregar os boletins.

            </div>

        `;

        console.error(err);

    }

}

carregar();

</script>

</body>
</html>
