<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agrometeorologia</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
  --verde:#0b5d42;
  --castanho:#4b2c1e;
  --dourado:#e3c15a;
  --texto:#ffffff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--verde);
  color:var(--texto);
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:25px 15px;
}

h1{
  margin:0;
  color:var(--dourado);
}

.subtitulo{
  margin-top:8px;
  color:#ddd;
}

.resumo{
  margin:20px;
  padding:15px;
  text-align:center;
  background:var(--castanho);
  border-left:5px solid var(--dourado);
  border-radius:12px;
}

.resumo strong{
  color:var(--dourado);
  font-size:1.4rem;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}

.card{
  background:var(--castanho);
  border-left:5px solid var(--dourado);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

.card h2{
  margin-top:0;
  color:var(--dourado);
}

.badge{
  display:inline-block;
  background:#9a6300;
  padding:6px 12px;
  border-radius:30px;
  margin-bottom:15px;
}

.secao{
  margin-top:15px;
}

.secao h3{
  color:var(--dourado);
  margin-bottom:10px;
}

ul{
  margin-top:5px;
}

li{
  margin-bottom:8px;
}

.pdf-btn{
  display:inline-block;
  margin-top:20px;
  padding:10px 16px;
  text-decoration:none;
  background:var(--dourado);
  color:#000;
  border-radius:8px;
  font-weight:bold;
}

details{
  background:var(--castanho);
  border-left:5px solid var(--dourado);
  border-radius:12px;
  padding:15px;
}

summary{
  cursor:pointer;
  font-size:18px;
  color:var(--dourado);
  font-weight:bold;
}

.arquivo-item{
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.arquivo-item:last-child{
  border-bottom:none;
}

.arquivo-link{
  color:white;
  text-decoration:none;
}

.loading{
  text-align:center;
  padding:40px;
}

.erro{
  background:#8b0000;
  padding:20px;
  border-radius:12px;
}

</style>
</head>

<body>

<header>

<h1>🌱 Agrometeorologia</h1>

<div class="subtitulo">
Avisos Agrícolas Oficiais da Guarda
</div>

</header>

<div id="resumo" class="resumo">

A carregar boletins...

</div>

<div class="container">

<div id="ultimo">

<div class="loading">

A carregar último boletim...

</div>

</div>

<div id="arquivo-container">

</div>

</div>

<script>

const API =
"https://small-glade-3bb9.ruijpms.workers.dev/?feed=agrometeo";

function criarLista(texto){

    if(!texto) return "";

    return texto
      .split(",")
      .map(item => item.trim())
      .filter(item => item)
      .map(item => `<li>${item}</li>`)
      .join("");

}

async function carregar(){

    try{

        const resp =
          await fetch(API);

        const dados =
          await resp.json();

        document.getElementById("resumo").innerHTML = `
            <strong>${dados.totalBoletins}</strong><br>
            boletins disponíveis em ${dados.ano}
        `;

        if(!dados.ultimoBoletim){

            document.getElementById("ultimo").innerHTML = `
                <div class="card">
                    ✅ Não existem boletins ativos.
                </div>
            `;

            return;

        }

        const b = dados.ultimoBoletim;

        document.getElementById("ultimo").innerHTML = `

            <div class="card">

                <h2>
                    🚨 Último Boletim
                </h2>

                <h2>
                    ${b.circular}
                </h2>

                <div class="badge">

                    ${b.ea}

                </div>

                <div class="secao">

                    <h3>
                        🌾 Culturas Afetadas
                    </h3>

                    <ul>

                        ${criarLista(b.cultura)}

                    </ul>

                </div>

                <div class="secao">

                    <h3>
                        🦠 Pragas e Doenças
                    </h3>

                    <ul>

                        ${criarLista(b.inimigos)}

                    </ul>

                </div>

                <a
                  class="pdf-btn"
                  href="${b.pdf}"
                  target="_blank">

                  📄 Abrir Circular

                </a>

            </div>

        `;

        let arquivoHTML = "";

        if(dados.arquivo &&
           dados.arquivo.length){

            arquivoHTML = `

            <details>

                <summary>

                    📚 Arquivo de Boletins
                    (${dados.arquivo.length})

                </summary>

                ${dados.arquivo.map(item => `

                    <div class="arquivo-item">

                        <a
                          class="arquivo-link"
                          href="${item.pdf}"
                          target="_blank">

                          📄 ${item.circular}

                        </a>

                    </div>

                `).join("")}

            </details>

            `;

        }

        document.getElementById(
          "arquivo-container"
        ).innerHTML = arquivoHTML;

    }
    catch(err){

        document.getElementById("ultimo").innerHTML = `
            <div class="erro">
                ❌ Erro ao carregar boletins.
            </div>
        `;

        console.error(err);

    }

}

carregar();

</script>

</body>
</html>
