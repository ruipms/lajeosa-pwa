<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--verde-base);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    .club-logo {
      width: 120px;
    }

    .back-button {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;

    }

    .card-full {
      background-color: var(--cor-cartao-castanho-escuro) !important;
      padding: 18px !important;
      border-radius: 20px !important;
      margin: 16px 20px !important;
      cursor: pointer;
      transition: 0.25s !important;
      text-align: left !important;
      font-size: 20px !important;
      color: white !important;
      border: 1px solid rgba(227,193,90,0.4) !important;
      box-shadow: 0 0 12px rgba(227,193,90,0.35) !important;
      border-left: 4px solid var(--dourado) !important;
    }

    .card-full:hover {
      transform: translateY(-4px) !important;
      box-shadow: 0 0 18px rgba(227,193,90,0.55) !important;
    }

    .card-full i {
      margin-right: 10px;

<div class="card-full" onclick="openPage('seniorfem_plantel.html')">
  <i>👩</i> Plantel

<div class="card-full" onclick="openPage('seniorfem_avisos.html')">
