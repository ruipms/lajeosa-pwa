<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trânsito – Lajeosa</title>

<!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #0F3D2E;
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        padding: 20px;
    }

    header img {
        width: 120px;
        display: block;
        margin: 0 auto;
    }

    h1 {
        margin-top: 10px;
        font-size: 24px;
        font-weight: bold;
    }

    /* Botão voltar — igual às outras páginas da Segurança */
    .btn-voltar {
        display: block;
        margin: 12px auto 0 auto;
        padding: 10px 18px;
        border-radius: 18px;
        background-color: #1F5C45;
        border: 1px solid #D4AF37;
        color: #D4AF37;
        font-size: 15px;
        text-decoration: none;
        width: fit-content;
        cursor: pointer;
    }

    .btn-voltar:hover {
        background-color: #2a7a5e;
    }

    .sec-title {
        color: #D4AF37;
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
        margin-bottom: 10px;
    }

    .card {
        background-color: #1F5C45;
        padding: 18px;
        border-radius: 18px;
        margin: 16px 20px;
        border: 1px solid rgba(212,175,55,0.4);
        text-align: center;
    }

    .card iframe {
        border-radius: 12px;
        width: 100%;
        max-width: 480px;
        height: 430px;
        border: none;
    }

    .card p {
        font-size: 14px;
        margin-top: 10px;
        color: #D4AF37;
    }
</style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>

    <h1>Trânsito</h1>
    <p style="color:#D4AF37; font-size:14px;">Fonte: transitoagora.pt</p>
</header>

<h2 class="sec-title">Estado Atual</h2>

<div class="card">
    <iframe 
        src="https://transitoagora.pt/embed?distrito=guarda"
        title="Trânsito em Guarda, ao vivo"
        loading="lazy">
    </iframe>

    <p>
        <a href="https://transitoagora.pt/transito/guarda" 
           target="_blank" 
           rel="noopener"
           style="color:#D4AF37; text-decoration:none;">
           Ver trânsito em tempo real em Guarda
        </a>
    </p>
</div>

<script>
function openPage(page) {
    window.location.href = page;
}
</script>

</body>
</html>
