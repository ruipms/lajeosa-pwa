<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trânsito – Lajeosa</title>

<link rel="stylesheet" href="style.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: var(--verde-base);
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header img {
        width: 120px;
        margin: 0 auto;
        display: block;
        padding-top: 20px;
    }

    .btn-voltar {
        display: block;
        margin: 12px auto 0 auto;
        padding: 10px 18px;
        border-radius: 18px;
        background-color: var(--cor-cartao-castanho-escuro);
        border-left: 4px solid var(--dourado);
        color: var(--dourado);
        font-size: 15px;
        text-decoration: none;
        width: fit-content;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .btn-voltar:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 18px rgba(227,193,90,0.55);
    }

    .sec-title {
        color: var(--dourado);
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
    }

    .card {
        background-color: var(--cor-cartao-castanho-escuro);
        padding: 16px;
        border-radius: 18px;
        margin: 16px 20px;
        border-left: 4px solid var(--dourado);
        text-align: left;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .card i {
        font-size: 26px;
        color: var(--dourado);
        margin-right: 10px;
    }

    .card-title {
        font-size: 18px;
        font-weight: bold;
        color: var(--dourado);
        margin-bottom: 6px;
    }

    .source {
        margin-top: 8px;
        font-size: 12px;
        color: var(--dourado);
        opacity: 0.8;
    }
</style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa">
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
    <h1 style="color:var(--dourado);">Trânsito</h1>
    <p style="color:var(--dourado); font-size:14px;">Fonte: transitoagora.pt</p>
</header>

<!-- OCORRÊNCIAS EM TEMPO REAL -->
<h2 class="sec-title">Ocorrências no Distrito da Guarda</h2>
<div id="lista"></div>

<!-- ALERTAS PROGRAMADOS -->
<h2 class="sec-title">Alertas Programados – Município da Guarda</h2>
<div id="alertas-programados"></div>

<script>
/* ============================================================
   OCORRÊNCIAS EM TEMPO REAL (api-transito)
   ============================================================ */
async function carregarIncidentes() {
    const url = "/api-transito";

    try {
        const resposta = await fetch(url);
        const dados = await resposta.json();

        const lista = document.getElementById("lista");
        lista.innerHTML = "";

        const incidentes = dados.incidents || [];

        if (incidentes.length === 0) {
            lista.innerHTML = "<p style='color:var(--dourado);'>Sem ocorrências no momento.</p>";
            return;
        }

        const unicos = {};

        incidentes.forEach(item => {
            const chave = item.title || item.id;

            if (!unicos[chave]) {
                unicos[chave] = item;
            } else {
                const atual = new Date(unicos[chave].updatedAt);
                const novo = new Date(item.updatedAt);

                if (novo > atual) {
                    unicos[chave] = item;
                }
            }
        });

        let listaFinal = Object.values(unicos);

        const agora = Date.now();
        const limite = 48 * 60 * 60 * 1000;

        listaFinal = listaFinal.filter(item => {
            const atualizado = new Date(item.updatedAt).getTime();
            return (agora - atualizado) <= limite;
        });

        if (listaFinal.length === 0) {
            lista.innerHTML = "<p style='color:var(--dourado);'>Sem ocorrências no momento.</p>";
            return;
        }

        listaFinal.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";

            const icone = {
                accident: "fa-car-burst",
                fire: "fa-fire",
                weather: "fa-cloud-rain",
                traffic: "fa-road",
                closure: "fa-ban",
                transit: "fa-bus"
            }[item.type] || "fa-circle-info";

            card.innerHTML = `
                <div class="card-title">
                    <i class="fa-solid ${icone}"></i>
                    ${item.title || item.type.toUpperCase()}
                </div>

                <p><strong>Concelho:</strong> ${item.district || "—"}</p>
                <p><strong>Descrição:</strong> ${item.description || "—"}</p>
                <p><strong>Início:</strong> ${new Date(item.startedAt).toLocaleString("pt-PT")}</p>
                <p><strong>Última atualização:</strong> ${new Date(item.updatedAt).toLocaleString("pt-PT")}</p>
                <p><strong>Estrada:</strong> ${item.road || "Não especificado"}</p>

                <div class="source">Fonte: ${item.source}</div>
            `;

            lista.appendChild(card);
        });

    } catch (erro) {
        document.getElementById("lista").innerHTML =
            "<p style='color:var(--dourado);'>Erro ao carregar dados.</p>";
    }
}

/* ============================================================
   ALERTAS PROGRAMADOS (Câmara Municipal da Guarda)
   ============================================================ */
async function carregarAlertasProgramados() {
    const url = "/api-alertas-municipio";

    try {
        const resposta = await fetch(url);
        const dados = await resposta.json();

        const lista = document.getElementById("alertas-programados");
        lista.innerHTML = "";

        const avisos = dados.items || [];

        if (avisos.length === 0) {
            lista.innerHTML = "<p style='color:var(--dourado);'>Sem alertas programados.</p>";
            return;
        }

        avisos.forEach(item => {
            const card = document.createElement("div");
            card.className = "card";

            const texto = item?.content?.[0]?.setup?.text || "—";

            card.innerHTML = `
                <div class="card-title">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    ${item.title}
                </div>

                <p><strong>Publicado:</strong> ${new Date(item.created_at).toLocaleString("pt-PT")}</p>
                <p>${texto}</p>

                <div class="source">Fonte: Município da Guarda</div>
            `;

            lista.appendChild(card);
        });

    } catch (erro) {
        document.getElementById("alertas-programados").innerHTML =
            "<p style='color:var(--dourado);'>Erro ao carregar alertas programados.</p>";
    }
}

function openPage(page) {
    window.location.href = page;
}

carregarIncidentes();
carregarAlertasProgramados();
</script>

</body>
</html>
