<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrências — Beiras e Serra da Estrela</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #D4AF37;
        }

        .btn-voltar {
            background-color: #1F5C45;
            color: #D4AF37;
            padding: 10px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            background-color: #2a7a5e;
        }

        .sec-title {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .card-inc {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            margin: 16px 20px;
            text-align: left;
        }

        .linha-titulo {
            color: #D4AF37;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .linha1, .linha2 {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .linha1 span, .linha2 span {
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 15px;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Ocorrências — Beiras e Serra da Estrela</h1>
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
</header>

<p id="atualizado" style="opacity:0.8; font-size:14px;"></p>

<h2 class="sec-title">Ocorrências Ativas</h2>
<div id="ativos"></div>

<h2 class="sec-title">Ocorrências Concluídas</h2>
<div id="concluidos"></div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    // NOVO FEED COMPLETO
    const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=arcgis-full";

    function tipoIcone(tipo) {
        tipo = tipo.toLowerCase();

        if (tipo.includes("acidente")) return "🚗";
        if (tipo.includes("inunda")) return "🌧️";
        if (tipo.includes("socorro") || tipo.includes("assist")) return "🚑";
        if (tipo.includes("risco") || tipo.includes("preven")) return "⚠️";
        if (tipo.includes("gás") || tipo.includes("gas")) return "🔥";
        if (tipo.includes("queda")) return "🌲";
        if (tipo.includes("apoio")) return "🛠️";

        return "📍"; // fallback
    }

    async function carregarOcorrencias() {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        document.getElementById("atualizado").textContent =
            "Atualizado: " + new Date(dados.updated).toLocaleString("pt-PT");

        const lista = dados.incidents || [];

        // Separar por estado
        const ativos = lista.filter(inc =>
            inc.status.toLowerCase().includes("curso") ||
            inc.status.toLowerCase().includes("resolução") ||
            inc.status.toLowerCase().includes("vigil") ||
            inc.status.toLowerCase().includes("alerta") ||
            inc.status.toLowerCase().includes("despacho")
        );

        const concluidos = lista.filter(inc =>
            inc.status.toLowerCase().includes("conclus")
        );

        // Mostrar ativos
        let htmlAtivos = "";

        if (ativos.length === 0) {
            htmlAtivos = `
                <p style="opacity:0.8; font-size:16px; margin:20px;">
                    Não existem ocorrências ativas neste momento.
                </p>
            `;
        } else {
            ativos.forEach(inc => {
                const icone = tipoIcone(inc.type);
                const data = inc.date || "Data não disponível";

                htmlAtivos += `
                    <div class="card-inc">
                        <div class="linha-titulo">${icone} ${inc.type} — ${inc.status}</div>
                        <div class="linha1">
                            <span>${inc.county || "Concelho desconhecido"}</span>
                            <span>${inc.parish || "Freguesia desconhecida"}</span>
                            <span>${inc.location || "Local não indicado"}</span>
                        </div>
                        <div class="linha2">
                            <span>🕒 ${new Date(data).toLocaleString("pt-PT")}</span>
                            <span>👥 ${inc.human}</span>
                            <span>🚒 ${inc.terrestrial}</span>
                            <span>✈️ ${inc.aerial}</span>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById("ativos").innerHTML = htmlAtivos;

        // Mostrar concluídos
        let htmlConcluidos = "";

        concluidos.forEach(inc => {
            const icone = tipoIcone(inc.type);
            const data = inc.date || "Data não disponível";

            htmlConcluidos += `
                <div class="card-inc">
                    <div class="linha-titulo">🟩 ${icone} ${inc.type} — ${inc.status}</div>
                    <div class="linha1">
                        <span>${inc.county || "Concelho desconhecido"}</span>
                        <span>${inc.parish || "Freguesia desconhecida"}</span>
                        <span>${inc.location || "Local não indicado"}</span>
                    </div>
                    <div class="linha2">
                        <span>🕒 ${new Date(data).toLocaleString("pt-PT")}</span>
                        <span>👥 ${inc.human}</span>
                        <span>🚒 ${inc.terrestrial}</span>
                        <span>✈️ ${inc.aerial}</span>
                    </div>
                </div>
            `;
        });

        document.getElementById("concluidos").innerHTML = htmlConcluidos;
    }

    carregarOcorrencias();

    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
