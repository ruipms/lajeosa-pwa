<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocorrências — Beiras e Serra da Estrela</title>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #D4AF37;
        }

        .btn-voltar {
            background-color: #1F5C45;
            color: #D4AF37;
            padding: 10px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            background-color: #2a7a5e;
        }

        .atualizado {
            font-size: 14px;
            opacity: 0.8;
        }

        .contador {
            margin-top: 15px;
            font-size: 17px;
            color: #D4AF37;
            font-weight: bold;
        }

        .card-ocor {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            margin: 16px 20px;
            text-align: left;
        }

        .linha-titulo {
            color: #D4AF37;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .linha1, .linha2 {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .linha1 span, .linha2 span {
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 15px;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Ocorrências — Beiras e Serra da Estrela</h1>
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
</header>

<p class="atualizado" id="atualizado"></p>
<p class="contador" id="contador"></p>

<div id="ocorrencias"></div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=occbeiras";

    function tipoIcone(tipo) {
        tipo = tipo.toLowerCase();

        if (tipo.includes("incêndio")) return "🔥";
        if (tipo.includes("acidente")) return "🚗";
        if (tipo.includes("inundação")) return "🌧️";
        if (tipo.includes("assistência") || tipo.includes("socorro")) return "🛟";
        if (tipo.includes("mato")) return "🌿";
        if (tipo.includes("povoamento")) return "🌲";
        return "⚠️";
    }

    async function carregarOcorrencias() {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        document.getElementById("atualizado").textContent =
            "Atualizado: " + new Date(dados.updated).toLocaleString("pt-PT");

        const lista = dados.occurrences || [];

        document.getElementById("contador").textContent =
            lista.length === 0
                ? "Não há ocorrências ativas hoje."
                : `${lista.length} ocorrência(s) ativa(s) hoje.`;

        let html = "";

        lista.forEach(oc => {
            const icone = tipoIcone(oc.type);

            html += `
                <div class="card-ocor">

                    <div class="linha-titulo">${icone} ${oc.type}</div>

                    <div class="linha1">
                        <span>${oc.county}</span>
                        <span>${oc.parish}</span>
                    </div>

                    <div class="linha2">
                        <span>🕒 ${new Date(oc.timestamp).toLocaleString("pt-PT")}</span>
                        <span>👥 ${oc.resources.human}</span>
                        <span>🚒 ${oc.resources.terrestrial}</span>
                        <span>✈️ ${oc.resources.aerial}</span>
                    </div>

                </div>
            `;
        });

        document.getElementById("ocorrencias").innerHTML = html;
    }

    carregarOcorrencias();

    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
