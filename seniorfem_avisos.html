<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avisos — Sénior Feminino</title>
  <link rel="stylesheet" href="style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FTEGNRDBJW');
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--verde-base);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    .club-logo {
      width: 120px;
    }

    .back-button {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      color: var(--dourado);
      font-weight: bold;
    }

    .content {
      padding: 20px;
    }

    /* Cartão castanho premium */
    .card {
      background-color: var(--cor-cartao-castanho-escuro) !important;
      padding: 20px !important;
      border-radius: 20px !important;
      margin-bottom: 20px !important;
      text-align: center !important;
      color: white !important;
      border: 1px solid rgba(227,193,90,0.4) !important;
      box-shadow: 0 0 12px rgba(227,193,90,0.35) !important;
      border-left: 4px solid var(--dourado) !important;
    }

    .card h3 {
      color: var(--dourado);
      margin-bottom: 20px;
    }

    .aviso-img {
      width: 90%;
      max-width: 600px;
      border-radius: 12px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: 0.2s;
      border: 2px solid var(--dourado);
    }

    .aviso-img:hover {
      transform: scale(1.02);
    }

    /* Modal */
    #imgModal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    #imgModal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      pointer-events: none;
      border: 2px solid var(--dourado);
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 25px;
      font-size: 32px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }
  </style>
</head>

<body>

<header>
  <img src="assets/CRC Lajeosa logo.jpg" class="club-logo">
  <h1>Avisos — Sénior Feminino</h1>
  <a href="clube_feminino.html" class="back-button">⬅ Voltar</a>
</header>

<div class="content">

  <div class="card">
    <h3>📢 Avisos</h3>

    <!-- Mensagem dinâmica -->
    <p id="noAvisosMsg" style="color:var(--dourado); font-size:20px; font-weight:bold; margin-top:20px;">
      Não há avisos
    </p>

    <!-- Aviso -->
    <img src="assets/jogadoras/tacafem2026.jpg"
         alt="Aviso"
         class="aviso-img"
         onclick="openModal('assets/jogadoras/tacafem2026.jpg')">

  </div>

</div>

<!-- Modal -->
<div id="imgModal" onclick="closeModal()">
  <span class="close-btn" onclick="closeModal()">✖</span>
  <img id="modalImg" src="">
</div>

<script>
function openModal(src) {
  const modal = document.getElementById("imgModal");
  const img = document.getElementById("modalImg");

  img.src = src;
  modal.style.display = "flex";
}

function closeModal() {
  document.getElementById("imgModal").style.display = "none";
}

window.onload = function() {
  const avisos = document.querySelectorAll('.aviso-img');
  const msg = document.getElementById('noAvisosMsg');
  msg.style.display = avisos.length > 0 ? 'none' : 'block';
};
</script>

</body>
</html>
