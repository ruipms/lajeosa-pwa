<!DOCTYPE html> 
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incêndios — Distrito da Guarda</title>

    <!-- Carregar style.css -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--verde-base);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: var(--dourado);
        }

        .btn-voltar {
            background-color: var(--cor-cartao-castanho-escuro);
            color: var(--dourado);
            padding: 10px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .btn-voltar:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        .sec-title {
            color: var(--dourado);
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .card-inc {
            background-color: var(--cor-cartao-castanho-escuro);
            padding: 18px;
            border-radius: 18px;
            margin: 16px 20px;
            text-align: left;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .linha-titulo {
            color: var(--dourado);
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .linha1, .linha2 {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .linha1 span, .linha2 span {
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 15px;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
            color: var(--dourado);
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Incêndios — Distrito da Guarda</h1>
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
</header>

<p id="atualizado" style="opacity:0.8; font-size:14px; color:var(--dourado);"></p>

<h2 class="sec-title">Incêndios Ativos</h2>
<div id="ativos"></div>

<h2 class="sec-title">Incêndios Concluídos</h2>
<div id="concluidos"></div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    // NOVO FEED COM FOGOS.PT
    const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=incendios-guarda";

    function tipoIcone(status) {
        status = status.toLowerCase();
        if (status.includes("curso")) return "🔥";
        if (status.includes("resolução")) return "🟠";
        if (status.includes("vigil")) return "🟡";
        if (status.includes("despacho")) return "⚠️";
        return "🔥";
    }

    async function carregarIncendios() {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        document.getElementById("atualizado").textContent =
            "Atualizado: " + new Date(dados.updated).toLocaleString("pt-PT");

        const lista = dados.incidents || [];

        const ativos = lista.filter(inc =>
            inc.status.toLowerCase().includes("curso") ||
            inc.status.toLowerCase().includes("resolução") ||
            inc.status.toLowerCase().includes("vigil")
        );

        const concluidos = lista.filter(inc =>
            inc.status.toLowerCase().includes("conclus")
        );

        // ============================
        // 🔥 INCÊNDIOS ATIVOS
        // ============================
        let htmlAtivos = "";

        if (ativos.length === 0) {
            htmlAtivos = `
                <p style="opacity:0.8; font-size:16px; margin-top:10px; color:var(--dourado);">
                    Não há incêndios ativos no distrito da Guarda neste momento.
                </p>
            `;
        } else {
            ativos.forEach(inc => {
                const icone = tipoIcone(inc.status);
                const data = inc.date || "Data não disponível";

                htmlAtivos += `
                    <div class="card-inc">
                        <div class="linha-titulo">${icone} ${inc.status}</div>
                        <div class="linha1">
                            <span>${inc.county}</span>
                            <span>${inc.parish}</span>
                            <span>${inc.location}</span>
                        </div>
                        <div class="linha2">
                            <span>🕒 ${data}</span>
                            <span>👥 ${inc.human}</span>
                            <span>🚒 ${inc.terrestrial}</span>
                            <span>✈️ ${inc.aerial}</span>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById("ativos").innerHTML = htmlAtivos;

        // ============================
        // 🔥 INCÊNDIOS CONCLUÍDOS
        // ============================
        let htmlConcluidos = "";

        if (concluidos.length === 0) {
            htmlConcluidos = `
                <p style="opacity:0.8; font-size:16px; margin-top:10px; color:var(--dourado);">
                    Não há incêndios concluídos recentes no distrito da Guarda.
                </p>
            `;
        } else {
            concluidos.forEach(inc => {
                const data = inc.date || "Data não disponível";

                htmlConcluidos += `
                    <div class="card-inc">
                        <div class="linha-titulo">🟩 ${inc.status}</div>
                        <div class="linha1">
                            <span>${inc.county}</span>
                            <span>${inc.parish}</span>
                            <span>${inc.location}</span>
                        </div>
                        <div class="linha2">
                            <span>🕒 ${data}</span>
                            <span>👥 ${inc.human}</span>
                            <span>🚒 ${inc.terrestrial}</span>
                            <span>✈️ ${inc.aerial}</span>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById("concluidos").innerHTML = htmlConcluidos;
    }

    carregarIncendios();

    function openPage(page) {
        window.location.href = page;
    }
</script>

</body>
</html>
