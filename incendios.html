<!DOCTYPE html>
<html lang="pt"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incêndios — Distrito da Guarda</title>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: #D4AF37;
        }

        .btn-voltar {
            background-color: #1F5C45;
            color: #D4AF37;
            padding: 10px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 17px;
            display: inline-block;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-voltar:hover {
            background-color: #2a7a5e;
        }

        .atualizado {
            font-size: 14px;
            opacity: 0.8;
        }

        .contador {
            margin-top: 15px;
            font-size: 17px;
            color: #D4AF37;
            font-weight: bold;
        }

        .card-inc {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            margin: 16px 20px;
            text-align: left;
        }

        .linha-titulo {
            color: #D4AF37;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 10px;
            text-align: left;
        }

        .linha1, .linha2 {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .linha1 span, .linha2 span {
            background: rgba(255,255,255,0.1);
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 15px;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Incêndios — Distrito da Guarda</h1>
    <a class="btn-voltar" onclick="openPage('seguranca.html')">← Voltar</a>
</header>

<p class="atualizado" id="atualizado"></p>
<p class="contador" id="contador"></p>

<div id="incendios"></div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=fogos";

    function tipoIcone(status) {
        status = status.toLowerCase();

        if (status.includes("curso")) return "🔥";
        if (status.includes("resolução")) return "🟠";
        if (status.includes("vigil")) return "🟡";
        if (status.includes("despacho")) return "⚠️";
        return "🔥";
    }

    async function carregarIncendios() {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        document.getElementById("atualizado").textContent =
            "Atualizado: " + new Date(dados.updated).toLocaleString("pt-PT");

        const lista = dados.incidents || [];

        document.getElementById("contador").textContent =
            lista.length === 0
                ? "Não há incêndios ativos no distrito da Guarda."
                : `${lista.length} incêndio(s) ativo(s) no distrito da Guarda.`;

        let html = "";

        lista.forEach(inc => {
            const icone = tipoIcone(inc.status);

            let dataFormatada = "Data não disponível";
if (inc.date && !isNaN(Date.parse(inc.date))) {
    dataFormatada = new Date(inc.date).toLocaleString("pt-PT");
}


            html += `
                <div class="card-inc">

                    <div class="linha-titulo">${icone} ${inc.status}</div>

                    <div class="linha1">
                        <span>${inc.county}</span>
                        <span>${inc.parish}</span>
                        <span>${inc.location}</span>
                    </div>

                    <div class="linha2">
                        <span>🕒 ${dataFormatada}</span>
                        <span>👥 ${inc.human}</span>
                        <span>🚒 ${inc.terrestrial}</span>
                        <span>✈️ ${inc.aerial}</span>
                    </div>

                </div>
            `;
        });

        document.getElementById("incendios").innerHTML = html;
    }

    carregarIncendios();

    function openPage(page) {
        window.location.href = page;
    }
</script>


</body>
</html>
