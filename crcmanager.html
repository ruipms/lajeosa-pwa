<!DOCTYPE html>
<html lang="pt">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CRC Manager</title>

<link rel="stylesheet" href="style.css">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
window.dataLayer = window.dataLayer || [];

function gtag(){
    dataLayer.push(arguments);
}

gtag('js', new Date());
gtag('config', 'G-FTEGNRDBJW');
</script>

<style>

.card-jogo{
    background-color: var(--cor-cartao-castanho-escuro);
    border-left:4px solid var(--dourado);
    border-radius:18px;
    margin:16px 20px;
    padding:18px;
    box-shadow:0 0 12px rgba(227,193,90,0.35);
}

.estatisticas{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:10px;
}

.estat{
    background:rgba(255,255,255,0.05);
    padding:12px;
    border-radius:12px;
}

.estat strong{
    display:block;
    font-size:24px;
    color:var(--dourado);
}

.btn-jogar{
    display:block;
    width:100%;
    margin-top:15px;
    padding:14px;
    background:var(--dourado);
    color:black;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:18px;
}

.plantel-item{
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.plantel-item:last-child{
    border-bottom:none;
}

.resultado{
    text-align:center;
    font-size:20px;
    margin-top:15px;
}

.vitoria{
    color:#00cc66;
}

.empate{
    color:#ffcc00;
}

.derrota{
    color:#ff6666;
}

</style>

</head>

<body>

<div style="padding:15px;">
    <button class="btn-voltar"
            onclick="window.location.href='index.html'">

        ← Voltar

    </button>
</div>

<header style="text-align:center;">

    <h1>⚽ CRC Manager</h1>

    <p style="color:var(--dourado);">
        Leva o CRC Lajeosa ao topo
    </p>

</header>

<div class="card-jogo">

    <div class="estatisticas">

        <div class="estat">
            <strong id="dinheiro">5000€</strong>
            Dinheiro
        </div>

        <div class="estat">
            <strong id="pontos">0</strong>
            Pontos
        </div>

        <div class="estat">
            <strong id="jornada">1</strong>
            Jornada
        </div>

    </div>

</div>

<div class="card-jogo">

    <h2>👥 Plantel</h2>

    <div id="plantel"></div>
</div>

<div class="card-jogo">

    <h2>🏋️ Treino Semanal</h2>

    <select id="treino" onchange="mostrarTreino()">

        <option value="ofensivo">
            ⚔️ Ofensivo
        </option>

        <option value="defensivo">
            🛡️ Defensivo
        </option>

        <option value="fisico">
            🏃 Físico
        </option>

        <option value="moral">
            😊 Moral
        </option>

    </select>

    <p id="infoTreino"></p>

</div>
    

<div class="card-jogo">

    <h2>📅 Próximo jogo</h2>

    <div id="adversario"></div>

    <button class="btn-jogar"
            onclick="jogarJornada()">

        ▶️ Jogar Jornada

    </button>

    <div id="resultado"
         class="resultado">

    </div>

</div>

<div class="card-jogo">

    <h2>🏆 Classificação</h2>

    <div id="classificacao"></div>

</div>

<div class="card-jogo">

    <button class="btn-jogar"
            onclick="reiniciar()">

        🔄 Nova Carreira

    </button>

</div>

<script>

const equipaBase = {

    dinheiro: 5000,
    pontos: 0,
    jornada: 1,

    jogadores: [

        {
          nome: "João",
          ataque: 72,
          defesa: 60,
          forma: 80
        },

        {
          nome: "Pedro",
          ataque: 65,
          defesa: 72,
          forma: 76
        },

        {
          nome: "André",
          ataque: 81,
          defesa: 58,
          forma: 74
        },

        {
          nome: "Tiago",
          ataque: 70,
          defesa: 70,
          forma: 79
        },

        {
          nome: "Ricardo",
          ataque: 77,
          defesa: 63,
          forma: 82
        }

    ]

};

const adversarios = [
    "Gouveia FC",
    "Manteigas FC",
    "Sabugal",
    "Seia FC",
    "Pinhel",
    "Trancoso",
    "Fornos",
    "Celorico"
];

const classificacaoBase = [

    { nome: "CRC Lajeosa", pontos: 0 },
    { nome: "Gouveia FC", pontos: 0 },
    { nome: "Seia FC", pontos: 0 },
    { nome: "Sabugal", pontos: 0 },
    { nome: "Pinhel", pontos: 0 },
    { nome: "Trancoso", pontos: 0 },
    { nome: "Fornos", pontos: 0 },
    { nome: "Celorico", pontos: 0 },
    { nome: "Manteigas FC", pontos: 0 },
    { nome: "Guarda FC", pontos: 0 }

];

let classificacao =
JSON.parse(
    JSON.stringify(classificacaoBase)
);

let jogo =
JSON.parse(
localStorage.getItem("crc-manager")
) || equipaBase;
let treinoSelecionado = "ofensivo";

function guardar(){

    localStorage.setItem(
      "crc-manager",
      JSON.stringify(jogo)
    );

}

function atualizar(){

    document.getElementById(
      "dinheiro"
    ).textContent =
    jogo.dinheiro + "€";

    document.getElementById(
      "pontos"
    ).textContent =
    jogo.pontos;

    document.getElementById(
      "jornada"
    ).textContent =
    jogo.jornada;

    const plantel =
    document.getElementById("plantel");

    plantel.innerHTML =
    jogo.jogadores.map(j => `

        <div class="plantel-item">

            <strong>${j.nome}</strong>

            <br>

            ⚔️ ${j.ataque}

            🛡️ ${j.defesa}

            💪 ${j.forma}

        </div>

    `).join("");

    document.getElementById(
      "adversario"
    ).innerHTML =

    `CRC Lajeosa vs ${
        adversarios[
            jogo.jornada %
            adversarios.length
        ]
    }`;
    atualizarClassificacao();

}
function mostrarTreino(){

    treinoSelecionado =
      document.getElementById(
        "treino"
      ).value;

    let texto = "";

    if(treinoSelecionado === "ofensivo"){

        texto = `
        ⚔️ +5 Ataque
        <br>
        🛡️ -2 Defesa
        <br><br>
        Mais golos marcados, mas também mais golos sofridos.
        `;

    }

    if(treinoSelecionado === "defensivo"){

        texto = `
        🛡️ +5 Defesa
        <br>
        ⚔️ -2 Ataque
        <br><br>
        Menos golos sofridos, mas também menos capacidade atacante.
        `;

    }

    if(treinoSelecionado === "fisico"){

        texto = `
        🏃 +5 Forma
        <br>
        ⚔️ -1 Ataque
        <br>
        🛡️ -1 Defesa
        <br><br>
        Equipa mais consistente.
        `;

    }

    if(treinoSelecionado === "moral"){

        texto = `
        😊 +2 Ataque
        <br>
        😊 +2 Defesa
        <br>
        😊 +2 Forma
        <br>
        💰 -500€
        <br><br>
        Equipa mais motivada.
        `;

    }

    document.getElementById(
      "infoTreino"
    ).innerHTML = texto;

}

function atualizarClassificacao(){

   const tabela =
JSON.parse(
    JSON.stringify(classificacao)
);


    tabela[0].pontos = jogo.pontos;

   

    tabela.sort(
        (a,b) => b.pontos - a.pontos
    );

    document.getElementById(
        "classificacao"
    ).innerHTML = tabela.map((e,pos) => `

        <div class="plantel-item">

            <strong>
                ${pos + 1}º
            </strong>

            ${e.nome}

            <span style="float:right">

                ${e.pontos} pts

            </span>

        </div>

    `).join("");

}
function jogarJornada(){

  let forca =
jogo.jogadores.reduce(
  (s,j)=>
  s +
  ((j.ataque+j.defesa+j.forma)/3),
  0
);

let bonusAtaque = 0;
let bonusDefesa = 0;

if(treinoSelecionado === "ofensivo"){

    bonusAtaque = 1.5;
    bonusDefesa = -1;

}

if(treinoSelecionado === "defensivo"){

    bonusAtaque = -1;
    bonusDefesa = 1.5;

}

if(treinoSelecionado === "fisico"){

    bonusAtaque = 0.5;
    bonusDefesa = 0.5;

}

if(treinoSelecionado === "moral"){

    bonusAtaque = 1;
    bonusDefesa = 1;

    if(jogo.dinheiro >= 500){

        jogo.dinheiro -= 500;

    }

}
    const adversario =
    Math.floor(
      Math.random()*400
    ) + 250;

    const golosCRC =
Math.max(
0,
Math.floor(
    (forca/100) +
    bonusAtaque +
    (Math.random()*4)
));

const golosADV =
Math.max(
0,
Math.floor(
    (adversario/100) -
    bonusDefesa +
    (Math.random()*4)
));

    let classe = "";
    let texto  = "";

    if(golosCRC > golosADV){

        jogo.pontos += 3;

        classe = "vitoria";

        texto =
        "✅ Vitória (+3 pontos)";

    }
    else if(golosCRC === golosADV){

        jogo.pontos += 1;

        classe = "empate";

        texto =
        "🤝 Empate (+1 ponto)";

    }
    else{

        classe = "derrota";

        texto =
        "❌ Derrota";

    }

    document.getElementById(
      "resultado"
    ).innerHTML = `

      CRC Lajeosa
      ${golosCRC}
      -
      ${golosADV}

      ${
       adversarios[
        jogo.jornada %
        adversarios.length
       ]
      }

      <br><br>

      <span class="${classe}">
      ${texto}
      </span>

    `;

    jogo.jornada++;

    for(let i = 1; i < classificacao.length; i++){

    classificacao[i].pontos +=
        Math.floor(Math.random() * 3);

}

    guardar();

    atualizar();

}

function reiniciar(){

    if(confirm("Começar nova carreira?")){

        localStorage.removeItem("crc-manager");

        jogo = {
            dinheiro: 5000,
            pontos: 0,
            jornada: 1,

            jogadores: [

                {
                    nome: "João",
                    ataque: 72,
                    defesa: 60,
                    forma: 80
                },

                {
                    nome: "Pedro",
                    ataque: 65,
                    defesa: 72,
                    forma: 76
                },

                {
                    nome: "André",
                    ataque: 81,
                    defesa: 58,
                    forma: 74
                },

                {
                    nome: "Tiago",
                    ataque: 70,
                    defesa: 70,
                    forma: 79
                },

                {
                    nome: "Ricardo",
                    ataque: 77,
                    defesa: 63,
                    forma: 82
                }

            ]

        };

        // RESET DA CLASSIFICAÇÃO
       classificacao =
        JSON.parse(
            JSON.stringify(classificacaoBase)
        );

        treinoSelecionado = "ofensivo";

        document.getElementById(
            "treino"
        ).value = "ofensivo";

        mostrarTreino();

        document.getElementById(
            "resultado"
        ).innerHTML = "";

        guardar();

        atualizar();

    }

}

mostrarTreino();
atualizar();

</script>

</body>
</html>
