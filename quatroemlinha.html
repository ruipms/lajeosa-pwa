<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quatro em Linha - CRC Lajeosa</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--verde-base);
    color:white;
    text-align:center;
}

header img{
    width:120px;
    margin-top:20px;
}

h1{
    color:var(--dourado);
}

.btn-voltar{
    display:inline-block;
    margin-top:10px;
    padding:10px 18px;
    border-radius:18px;
    background-color:var(--cor-cartao-castanho-escuro);
    border-left:4px solid var(--dourado);
    color:var(--dourado);
    text-decoration:none;
    box-shadow:0 0 12px rgba(227,193,90,.35);
}

.explicacao{
    background-color:var(--cor-cartao-castanho-escuro);
    padding:18px;
    margin:20px;
    border-radius:18px;
    text-align:left;
    border-left:4px solid var(--dourado);
    box-shadow:0 0 12px rgba(227,193,90,.35);
}

.explicacao h2{
    color:var(--dourado);
}

#status{
    color:var(--dourado);
    font-size:22px;
    font-weight:bold;
    margin:20px 0;
}

#tabuleiro{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:8px;
    max-width:500px;
    margin:auto;
    padding:12px;
    background:var(--cor-cartao-castanho-escuro);
    border-radius:18px;
    border-left:4px solid var(--dourado);
    box-shadow:0 0 12px rgba(227,193,90,.35);
}

.celula{
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    background:#ddd;
    cursor:pointer;
    transition:.2s;
}

.celula:hover{
    transform:scale(1.05);
}

.jogador{
    background:var(--dourado);
}

.cpu{
    background:#e74c3c;
}

#novoJogo{
    margin-top:20px;
    margin-bottom:20px;
    padding:12px 24px;
    border:none;
    border-radius:18px;
    background-color:var(--cor-cartao-castanho-escuro);
    color:var(--dourado);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    border-left:4px solid var(--dourado);
    box-shadow:0 0 12px rgba(227,193,90,.35);
}

#novoJogo:hover{
    transform:translateY(-2px);
}

@media(max-width:600px){

    #tabuleiro{
        width:95%;
        gap:5px;
    }

}

</style>
</head>

<body>

<header>
    assets/brasao.png

    <h1>Quatro em Linha</h1>

    <a href="jogos.html" class="btn-voltar">
        ← Voltar
    </a>
</header>

<div class="explicacao">
    <h2>Como jogar?</h2>

    <p>
        Tenta alinhar 4 peças na horizontal,
        vertical ou diagonal antes do computador.
    </p>

    <ul>
        <li>🟡 Tu jogas primeiro.</li>
        <li>🔴 O computador responde.</li>
        <li>✅ Faz 4 em linha para vencer.</li>
    </ul>
</div>

<div id="status">
    A tua vez!
</div>

<div id="tabuleiro"></div>

<button id="novoJogo">
    Novo Jogo
</button>

<script>

const ROWS = 6;
const COLS = 7;

let board = [];
let jogoTerminado = false;

const tabuleiro = document.getElementById("tabuleiro");
const statusEl = document.getElementById("status");

function iniciarJogo(){

    board = [];

    jogoTerminado = false;

    statusEl.textContent = "A tua vez!";

    for(let r=0;r<ROWS;r++){

        board[r] = [];

        for(let c=0;c<COLS;c++){

            board[r][c] = 0;

        }
    }

    desenhar();
}

function desenhar(){

    tabuleiro.innerHTML = "";

    for(let r=0;r<ROWS;r++){

        for(let c=0;c<COLS;c++){

            const div = document.createElement("div");

            div.classList.add("celula");

            if(board[r][c] === 1)
                div.classList.add("jogador");

            if(board[r][c] === 2)
                div.classList.add("cpu");

            div.addEventListener("click",()=>{
                jogar(c);
            });

            tabuleiro.appendChild(div);
        }
    }
}

function jogar(col){

    if(jogoTerminado) return;

    let row = obterLinhaLivre(col);

    if(row === -1) return;

    board[row][col] = 1;

    desenhar();

    if(verificarVitoria(1)){

        statusEl.textContent = "🎉 Ganhaste!";

        jogoTerminado = true;
        return;
    }

    if(tabuleiroCheio()){

        statusEl.textContent = "Empate!";
        jogoTerminado = true;
        return;
    }

    statusEl.textContent = "Computador a pensar...";

    setTimeout(cpuJoga,500);
}

function cpuJoga(){

    let melhorCol = encontrarJogadaCPU();

    let row = obterLinhaLivre(melhorCol);

    board[row][melhorCol] = 2;

    desenhar();

    if(verificarVitoria(2)){

        statusEl.textContent = "🤖 O computador venceu.";

        jogoTerminado = true;
        return;
    }

    if(tabuleiroCheio()){

        statusEl.textContent = "Empate!";
        jogoTerminado = true;
        return;
    }

    statusEl.textContent = "A tua vez!";
}

function encontrarJogadaCPU(){

    for(let c=0;c<COLS;c++){

        let r = obterLinhaLivre(c);

        if(r === -1) continue;

        board[r][c] = 2;

        if(verificarVitoria(2)){

            board[r][c] = 0;

            return c;
        }

        board[r][c] = 0;
    }

    for(let c=0;c<COLS;c++){

        let r = obterLinhaLivre(c);

        if(r === -1) continue;

        board[r][c] = 1;

        if(verificarVitoria(1)){

            board[r][c] = 0;

            return c;
        }

        board[r][c] = 0;
    }

    const validas = [];

    for(let c=0;c<COLS;c++){

        if(obterLinhaLivre(c) !== -1){

            validas.push(c);

        }
    }

    return validas[Math.floor(Math.random()*validas.length)];
}

function obterLinhaLivre(col){

    for(let r=ROWS-1;r>=0;r--){

        if(board[r][col] === 0){

            return r;
        }
    }

    return -1;
}

function tabuleiroCheio(){

    for(let c=0;c<COLS;c++){

        if(obterLinhaLivre(c)!==-1){

            return false;
        }
    }

    return true;
}

function verificarVitoria(jogador){

    for(let r=0;r<ROWS;r++){

        for(let c=0;c<COLS-3;c++){

            if(
                board[r][c]===jogador &&
                board[r][c+1]===jogador &&
                board[r][c+2]===jogador &&
                board[r][c+3]===jogador
            ){

                return true;
            }
        }
    }

    for(let c=0;c<COLS;c++){

        for(let r=0;r<ROWS-3;r++){

            if(
                board[r][c]===jogador &&
                board[r+1][c]===jogador &&
                board[r+2][c]===jogador &&
                board[r+3][c]===jogador
            ){

                return true;
            }
        }
    }

    for(let r=0;r<ROWS-3;r++){

        for(let c=0;c<COLS-3;c++){

            if(
                board[r][c]===jogador &&
                board[r+1][c+1]===jogador &&
                board[r+2][c+2]===jogador &&
                board[r+3][c+3]===jogador
            ){

                return true;
            }
        }
    }

    for(let r=3;r<ROWS;r++){

        for(let c=0;c<COLS-3;c++){

            if(
                board[r][c]===jogador &&
                board[r-1][c+1]===jogador &&
                board[r-2][c+2]===jogador &&
                board[r-3][c+3]===jogador
            ){

                return true;
            }
        }
    }

    return false;
}

document
.getElementById("novoJogo")
.addEventListener("click", iniciarJogo);

iniciarJogo();

</script>

</body>
</html>
