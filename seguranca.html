<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança</title>

    <!-- Google tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <!-- Métricas avançadas da PWA -->
    <script>
    window.addEventListener('appinstalled', () => {
        gtag('event', 'pwa_install', { event_category: 'PWA', event_label: 'Instalação da App' });
    });

    if (window.matchMedia('(display-mode: standalone)').matches) {
        gtag('event', 'pwa_launch_icon', { event_category: 'PWA', event_label: 'Abertura via ícone' });
    }

    if (!localStorage.getItem('pwa_first_visit')) {
        localStorage.setItem('pwa_first_visit', '1');
        gtag('event', 'pwa_first_open', { event_category: 'PWA', event_label: 'Primeira visita' });
    } else {
        gtag('event', 'pwa_return_open', { event_category: 'PWA', event_label: 'Visita recorrente' });
    }

    window.addEventListener('offline', () => {
        gtag('event', 'pwa_offline_use', { event_category: 'PWA', event_label: 'Uso offline' });
    });

    window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('Failed to fetch')) {
            gtag('event', 'pwa_network_error', { event_category: 'PWA', event_label: 'Erro de rede' });
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const ref = document.referrer;
        if (ref.includes('whatsapp')) gtag('event', 'pwa_open_whatsapp');
        if (ref.includes('instagram')) gtag('event', 'pwa_open_instagram');
        if (ref.includes('facebook')) gtag('event', 'pwa_open_facebook');
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            gtag('event', 'pwa_update_trigger', { event_category: 'PWA', event_label: 'Atualização da aplicação' });
        });
    }

    setInterval(() => {
        gtag('event', 'pwa_active_tick', { event_category: 'PWA', event_label: 'Atividade contínua' });
    }, 15000);
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/brasao.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
        }

        .sec-title {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 10px 20px;
        }

        .card {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background-color: #2a7a5e;
        }

        .card i {
            font-size: 36px;
            color: #D4AF37;
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
        }

        .back-btn {
            background-color: #1F5C45;
            padding: 15px;
            border-radius: 18px;
            margin: 20px auto;
            width: 200px;
            cursor: pointer;
            transition: 0.2s;
        }

        .back-btn:hover {
            background-color: #2a7a5e;
        }

        .back-btn i {
            font-size: 24px;
            color: #D4AF37;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Segurança e Avisos</h1>
</header>

<h2 class="sec-title">Informação em Tempo Real</h2>

<div class="grid">

  <div class="card" onclick="openPage('incendios.html')">
        <i class="fas fa-fire"></i>
        <p>Incêndios Ativos</p>
    </div>

    <div class="card" onclick="openLink('ocorrencias.html')">
        <i class="fas fa-exclamation-triangle"></i>
        <p>Ocorrências Ativas</p>
    </div>


   <div class="card" onclick="openLink('meteocritico.html')">
        <i class="fas fa-cloud-bolt"></i>
        <p>Meteorologia Crítica</p>
    </div>


    <div class="card" onclick="openLink('policia.html')">
        <i class="fas fa-shield-halved"></i>
        <p>Comunicados da Polícia</p>
    </div>

    <div class="card" onclick="openLink('https://www.fogos.pt/pt/avisos')">
        <i class="fas fa-road"></i>
        <p>Trânsito e Estradas</p>
    </div>


</div>

<!-- BOTÃO VOLTAR -->
<div class="back-btn" onclick="openPage('index.html')">
    <i class="fas fa-arrow-left"></i>
    <p>Voltar à Página Inicial</p>
</div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    function openLink(url) {
        window.open(url, '_blank');
    }

    function openPage(page) {
        window.location.href = page;
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>

</body>
</html>
