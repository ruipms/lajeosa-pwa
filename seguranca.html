<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança</title>

    <link rel="icon" href="assets/brasao.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0F3D2E;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
        }

        .sec-title {
            color: #D4AF37;
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 10px 20px;
        }

        .card {
            background-color: #1F5C45;
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background-color: #2a7a5e;
        }

        .card i {
            font-size: 36px;
            color: #D4AF37;
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Segurança e Avisos</h1>
</header>

<!-- SECÇÃO SEGURANÇA -->
<h2 class="sec-title">Informação em Tempo Real</h2>

<div class="grid">

    <!-- INCÊNDIOS -->
    <div class="card" onclick="openLink('https://www.fogos.pt/pt')">
        <i class="fas fa-fire"></i>
        <p>Incêndios Ativos</p>
    </div>

    <!-- OCORRÊNCIAS -->
    <div class="card" onclick="openLink('https://ocorrenciasativas.pt/')">
        <i class="fas fa-triangle-exclamation"></i>
        <p>Ocorrências Ativas</p>
    </div>

    <!-- METEOROLOGIA -->
    <div class="card" onclick="openLink('https://www.ipma.pt/pt/otempo/prev.localidade.hora/index.jsp#Guarda&Guarda')">
        <i class="fas fa-cloud-sun"></i>
        <p>Meteorologia Crítica</p>
    </div>

    <!-- GNR -->
    <div class="card" onclick="openLink('https://www.gnr.pt/Comunicados.aspx')">
        <i class="fas fa-shield-halved"></i>
        <p>Comunicados da GNR</p>
    </div>

    <!-- ESTRADAS -->
    <div class="card" onclick="openLink('https://servicos.infraestruturasdeportugal.pt/viajar-na-estrada/transito-em-tempo-real')">
        <i class="fas fa-road"></i>
        <p>Trânsito e Estradas</p>
    </div>

</div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    function openLink(url) {
        window.open(url, '_blank');
    }
</script>

</body>
</html>
