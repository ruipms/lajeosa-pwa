<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança</title>

    <!-- Carregar style.css -->
    <link rel="stylesheet" href="style.css">

    <!-- Google tag -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FTEGNRDBJW');
    </script>

    <!-- Métricas avançadas da PWA -->
    <script>
        window.addEventListener('appinstalled', () => gtag('event', 'pwa_install'));
        if (window.matchMedia('(display-mode: standalone)').matches) gtag('event', 'pwa_launch_icon');

        if (!localStorage.getItem('pwa_first_visit')) {
            localStorage.setItem('pwa_first_visit', '1');
            gtag('event', 'pwa_first_open');
        } else gtag('event', 'pwa_return_open');

        window.addEventListener('offline', () => gtag('event', 'pwa_offline_use'));

        window.addEventListener('error', (e) => {
            if (e.message && e.message.includes('Failed to fetch')) {
                gtag('event', 'pwa_network_error');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const ref = document.referrer;
            if (ref.includes('whatsapp')) gtag('event', 'pwa_open_whatsapp');
            if (ref.includes('instagram')) gtag('event', 'pwa_open_instagram');
            if (ref.includes('facebook')) gtag('event', 'pwa_open_facebook');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                gtag('event', 'pwa_update_trigger');
            });
        }

        setInterval(() => gtag('event', 'pwa_active_tick'), 15000);
    </script>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/brasao.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--verde-base);
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 140px;
        }

        h1 {
            margin-top: 10px;
            font-size: 26px;
            font-weight: bold;
            color: var(--dourado);
        }

        .sec-title {
            color: var(--dourado);
            font-size: 20px;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            padding: 10px 20px;
        }

        .card {
            background-color: var(--cor-cartao-castanho-escuro);
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .card:hover {
            background-color: var(--cor-cartao-castanho-claro);
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        .card i {
            font-size: 36px;
            color: var(--dourado);
        }

        .card p {
            font-size: 17px;
            margin-top: 8px;
        }

        .back-btn {
            background-color: var(--cor-cartao-castanho-escuro);
            padding: 15px;
            border-radius: 18px;
            margin: 20px auto;
            width: 200px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid var(--dourado);
            box-shadow: 0 0 12px rgba(227,193,90,0.35);
        }

        .back-btn:hover {
            background-color: var(--cor-cartao-castanho-claro);
            transform: translateY(-3px);
            box-shadow: 0 0 18px rgba(227,193,90,0.55);
        }

        .back-btn i {
            font-size: 24px;
            color: var(--dourado);
        }

        footer {
            margin-top: 30px;
            padding: 10px;
            font-size: 14px;
            opacity: 0.7;
            color: var(--dourado);
        }
    </style>
</head>

<body>

<header>
    <img src="assets/brasao.png" alt="Brasão da Lajeosa do Mondego">
    <h1>Segurança e Avisos</h1>
</header>

<h2 class="sec-title">Informação em Tempo Real</h2>

<div class="grid">

    <div class="card" onclick="openPage('incendios.html')">
        <i class="fas fa-fire"></i>
        <p>Incêndios Ativos</p>
    </div>

    <div class="card" onclick="openPage('ocorrencias.html')">
        <i class="fas fa-exclamation-triangle"></i>
        <p>Ocorrências Ativas</p>
    </div>

    <div class="card" onclick="openPage('meteocritico.html')">
        <i class="fas fa-cloud-bolt"></i>
        <p>Meteorologia Crítica</p>
    </div>

    <div class="card" onclick="openPage('policia.html')">
        <i class="fas fa-shield-halved"></i>
        <p>Comunicados da Polícia</p>
    </div>

    <div class="card" onclick="openPage('transito2.html')">
        <i class="fas fa-road"></i>
        <p>Trânsito e Estradas</p>
    </div>
    
    <div class="card" onclick="openPage('combustiveis3.html')">
        <i class="fas fa-gas-pump"></i>
        <p>Preços dos combustíveis</p>
    </div>

</div>

<!-- BOTÃO VOLTAR -->
<div class="back-btn" onclick="openPage('index.html')">
    <i class="fas fa-arrow-left"></i>
    <p>Voltar à Página Inicial</p>
</div>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
    function openPage(page) {
        location.replace(page);
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>

</body>
</html>
