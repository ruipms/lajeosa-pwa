<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polícia Judiciária – Região da Guarda</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<style>
    body {
        background-color: #0F3D2E;
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        color: #D4AF37;
        text-align: center;
        margin-bottom: 20px;
    }

    .card {
        background-color: #134C3A;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 18px;
    }

    .titulo {
        font-size: 18px;
        font-weight: bold;
        color: #D4AF37;
        margin-bottom: 8px;
    }

    .data {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 10px;
    }

    .resumo {
        font-size: 15px;
        margin-bottom: 12px;
    }

    .btn-link {
        display: inline-block;
        background-color: #D4AF37;
        color: #0F3D2E;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: bold;
        text-decoration: none;
    }

    .btn-link:hover {
        background-color: #c09a2f;
    }

    .voltar {
        display: inline-block;
        margin-top: 30px;
        color: #D4AF37;
        font-size: 18px;
        text-decoration: none;
    }

    .mensagem {
        font-size: 16px;
        opacity: 0.8;
        margin-top: 10px;
    }

    footer {
        margin-top: 40px;
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
    }

    .pj-final {
        margin-top: 30px;
        text-align: center;
        font-size: 15px;
        opacity: 0.9;
    }
</style>
</head>
<body>

<h1>Polícia Judiciária – Região da Guarda</h1>

<div id="lista-pj">
    <p class="mensagem">A carregar notícias...</p>
</div>

<div class="pj-final">
    Para informação mais completa, consulte a página da Polícia Judiciária.<br>
    <a href="https://www.policiajudiciaria.pt" target="_blank" style="color:#D4AF37;">
        www.policiajudiciaria.pt
    </a>
</div>

<a class="voltar" href="seguranca.html">← Voltar</a>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<script>
const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=pj-guarda";

async function carregarNoticiasPJ() {
    const caixa = document.getElementById("lista-pj");

    try {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        const lista = dados.items || [];

        if (lista.length === 0) {
            caixa.innerHTML = `
                <p class="mensagem">Não há notícias policiais da região da Guarda neste momento.</p>
            `;
            return;
        }

        let html = "";

        lista.forEach(n => {
            html += `
                <div class="card">
                    <div class="titulo">${n.titulo}</div>
                    <div class="data">📅 ${n.data}</div>
                    <div class="resumo">${n.resumo}...</div>
                    <a class="btn-link" href="${n.link}" target="_blank">Ler notícia completa</a>
                </div>
            `;
        });

        caixa.innerHTML = html;

    } catch (e) {
        caixa.innerHTML = `
            <p class="mensagem">Erro ao carregar notícias da Polícia Judiciária.</p>
        `;
    }
}

carregarNoticiasPJ();
</script>

</body>
</html>
