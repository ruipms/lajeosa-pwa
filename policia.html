<!DOCTYPE html> 
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polícia Judiciária – Região da Guarda</title>

<!-- Carregar style.css -->
<link rel="stylesheet" href="style.css">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FTEGNRDBJW"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FTEGNRDBJW');
</script>

<style>
    body {
        background-color: var(--verde-base);
        color: white;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    h1 {
        color: var(--dourado);
        text-align: center;
        margin-bottom: 20px;
    }

    .card {
        background-color: var(--cor-cartao-castanho-claro);
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(10px);
        animation: fadeIn 0.4s forwards;
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    @keyframes fadeIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .titulo {
        font-size: 18px;
        font-weight: bold;
        color: var(--dourado);
        margin-bottom: 12px;
    }

    .btn-link {
        display: inline-block;
        background-color: var(--dourado);
        color: var(--verde-base);
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    .btn-link:hover {
        background-color: #c09a2f;
    }

    .voltar {
        display: inline-block;
        margin-top: 30px;
        color: var(--dourado);
        font-size: 18px;
        text-decoration: none;
        border-left: 4px solid var(--dourado);
        padding-left: 10px;
    }

    .mensagem {
        font-size: 16px;
        opacity: 0.9;
        margin-top: 10px;
        text-align: center;
        color: var(--dourado);
    }

    footer {
        margin-top: 40px;
        text-align: center;
        opacity: 0.7;
        font-size: 14px;
        color: var(--dourado);
    }

    .pj-final {
        margin-top: 30px;
        text-align: center;
        font-size: 15px;
        opacity: 0.9;
        color: var(--dourado);
    }

    /* ⭐ SKELETON PREMIUM */
    .skeleton {
        background: linear-gradient(90deg, var(--cor-cartao-castanho-claro) 25%, var(--cor-cartao-castanho-escuro) 50%, var(--cor-cartao-castanho-claro) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 12px;
        height: 70px;
        margin-bottom: 18px;
        border-left: 4px solid var(--dourado);
        box-shadow: 0 0 12px rgba(227,193,90,0.35);
    }

    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
</style>
</head>
<body>

<h1>Polícia Judiciária – Região da Guarda</h1>

<!-- ⭐ Mensagem de espera -->
<p id="msg-aguarde" class="mensagem">
    A carregar notícias da Polícia Judiciária… aguarde uns segundos.
</p>

<div id="lista-pj">
    <!-- Skeletons aparecem aqui -->
</div>

<div class="pj-final">
    Para informação mais completa, consulte a página da Polícia Judiciária.<br>
    <a href="https://www.policiajudiciaria.pt" target="_blank" style="color:var(--dourado);">
        www.policiajudiaria.pt
    </a>
</div>

<a class="voltar" href="seguranca.html">← Voltar</a>

<footer>
    2026 Lajeosa do Mondego — ©RMS
</footer>

<!-- ⭐ SCRIPT NO FIM DA PÁGINA -->
<script>
const WORKER_URL = "https://small-glade-3bb9.ruijpms.workers.dev/?feed=pj-guarda";

/* ⭐ Mostrar skeletons imediatamente */
function mostrarSkeletons() {
    const caixa = document.getElementById("lista-pj");
    caixa.innerHTML = "";
    for (let i = 0; i < 5; i++) {
        caixa.innerHTML += `<div class="skeleton"></div>`;
    }
}

async function carregarNoticiasPJ() {
    const caixa = document.getElementById("lista-pj");
    const msg = document.getElementById("msg-aguarde");

    // ⭐ Mostrar mensagem + skeletons
    msg.style.display = "block";
    mostrarSkeletons();

    try {
        const resposta = await fetch(WORKER_URL);
        const dados = await resposta.json();

        const lista = dados.items || [];

        // ⭐ Esconder mensagem quando terminar
        msg.style.display = "none";

        if (lista.length === 0) {
            caixa.innerHTML = `
                <p class="mensagem">Não há notícias policiais da região da Guarda neste momento.</p>
            `;
            return;
        }

        let html = "";

        lista.forEach(n => {
            html += `
                <div class="card">
                    <div class="titulo">${n.titulo}</div>
                    <a class="btn-link" href="${n.link}" target="_blank">Ler notícia completa</a>
                </div>
            `;
        });

        caixa.innerHTML = html;

    } catch (e) {
        msg.style.display = "none";
        caixa.innerHTML = `
            <p class="mensagem">Erro ao carregar notícias da Polícia Judiciária.</p>
        `;
    }
}

carregarNoticiasPJ();
</script>

</body>
</html>
